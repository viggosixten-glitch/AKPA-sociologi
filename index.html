<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sociologi">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>AKPA Sociologi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: Duolingo-style lesson app. Home = a Mini Motorways road winding between one stop per lecture and a final exam round; lesson = one question per screen with a feedback sheet. Apple-style hairlines, grouped lists and continuous rounded corners. */
:root{
  --ground:#EFEDE8; --surface:#FFFFFF; --surface-2:#F7F6F3; --ink:#26282E; --muted:#7D8089;
  --hair:rgba(38,40,46,.12); --road:#3B3E46; --road-edge:#2E3037;
  --blue:#3D8BDB; --teal:#25AE9A; --yellow:#F2B33A; --red:#E5525C; --orange:#EF8445; --pink:#EE7EA8; --purple:#8B6FD6;
  --good:#25AE9A; --bad:#E5525C;
  --good-tint:#DDF3EF; --bad-tint:#FBE3E4; --sel-tint:#E3EEFA;
  --f-round:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;
  --f-text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Nunito Sans","Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,monospace;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#17191D; --surface:#22252B; --surface-2:#1C1E23; --ink:#F1F1F3; --muted:#9A9EA7;
  --hair:rgba(255,255,255,.12); --road:#454952; --road-edge:#2C2F35;
  --blue:#5AA0EA; --teal:#33C2AD; --yellow:#F5BF55; --red:#F06A73; --orange:#F4985E; --pink:#F391B6; --purple:#9C84E2;
  --good:#33C2AD; --bad:#F06A73; --good-tint:#163A34; --bad-tint:#41202A; --sel-tint:#1D3350; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#17191D; --surface:#22252B; --surface-2:#1C1E23; --ink:#F1F1F3; --muted:#9A9EA7;
  --hair:rgba(255,255,255,.12); --road:#454952; --road-edge:#2C2F35;
  --blue:#5AA0EA; --teal:#33C2AD; --yellow:#F5BF55; --red:#F06A73; --orange:#F4985E; --pink:#F391B6; --purple:#9C84E2;
  --good:#33C2AD; --bad:#F06A73; --good-tint:#163A34; --bad-tint:#41202A; --sel-tint:#1D3350; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:16px/1.45 var(--f-text);-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 160px}
h1,h2,h3{font-family:var(--f-round);font-weight:800;margin:0;line-height:1.15;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
svg.i{width:22px;height:22px;flex:none}

/* top bar: Apple-style translucent, hairline under */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 8px;padding:12px max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--ground) 82%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);
  border-bottom:.5px solid var(--hair)}
.brand{font-family:var(--f-round);font-weight:900;font-size:19px;letter-spacing:-.01em}
.brand small{display:block;font:600 12px var(--f-text);color:var(--muted);letter-spacing:0}
.pills{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:99px;font:800 15px var(--f-round);font-variant-numeric:tabular-nums}
.pill.flame{color:var(--orange)} .pill.gem{color:var(--blue)} .pill.aim{color:var(--teal)}

/* the road */
.unit{margin:18px 0 6px;padding:16px 18px;border-radius:var(--r-lg);background:var(--blue);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--blue) 70%,#000)}
.unit h2{font-size:20px;color:#fff}
.unit p{margin:2px 0 0;font-size:14px;opacity:.9}
.map{position:relative;max-width:100%;margin:8px auto 18px}
.map svg.road{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.stop{position:absolute;width:140px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),color-mix(in srgb,var(--c) 18%,var(--surface)) 0);box-shadow:0 0 0 5px var(--ground)}
.node{width:76px;height:72px;border-radius:50%;border:none;display:grid;place-items:center;background:var(--c);color:#fff;
  box-shadow:0 6px 0 color-mix(in srgb,var(--c) 68%,#000);transform:translateY(-3px);transition:transform .08s,box-shadow .08s}
.node:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 68%,#000)}
.node b{font:900 30px var(--f-round)}
.stop.locked .node{background:color-mix(in srgb,var(--muted) 45%,var(--surface));box-shadow:0 6px 0 color-mix(in srgb,var(--muted) 60%,#000)}
.stop.locked .ring{background:var(--surface-2)}
.cap{font:800 15px var(--f-round);line-height:1.2}
.stop .cap{background:var(--ground);padding:5px 10px 6px;border-radius:12px;position:relative}
.cap span{display:block;font:600 12px var(--f-text);color:var(--muted);margin-top:2px}
.star{position:absolute;top:-4px;right:20px;width:28px;height:28px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;color:#fff;box-shadow:0 2px 0 color-mix(in srgb,var(--yellow) 70%,#000)}

/* grouped list (Apple) */
.section-h{font:600 13px var(--f-text);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:22px 4px 8px}
.group{background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.row{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center;padding:12px 16px;position:relative}
.row + .row::before{content:"";position:absolute;left:40px;right:0;top:0;border-top:.5px solid var(--hair)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red)}
.row .t{font-weight:600;min-width:0}
.row .r{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:1px}
.row .pct{font:800 17px var(--f-round);color:var(--red);font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:14px;padding:14px 16px;margin:0}
.foot{margin:10px 4px 0;font-size:12px;color:var(--muted)}

/* 3D buttons */
.btn{border:none;border-radius:var(--r-md);padding:14px 20px;font:800 16px var(--f-round);letter-spacing:.04em;text-transform:uppercase;
  background:var(--c,var(--blue));color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--c,var(--blue)) 68%,#000);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--c,var(--blue)) 68%,#000)}
.btn.wide{width:100%}
.btn.plain{background:var(--surface);color:var(--blue);box-shadow:0 4px 0 var(--hair),inset 0 0 0 1.5px var(--hair)}
.btn[disabled]{background:var(--surface-2);color:var(--muted);box-shadow:0 4px 0 var(--hair),inset 0 0 0 1.5px var(--hair);transform:none;cursor:not-allowed}
.btn.good{--c:var(--good)} .btn.bad{--c:var(--bad)}
.linkbtn{background:none;border:none;padding:6px 0;color:var(--blue);font-weight:600;font-size:15px}

/* lesson */
.lesson-top{display:flex;align-items:center;gap:14px;padding-block:16px 20px}
.x{width:34px;height:34px;border-radius:50%;border:none;background:none;display:grid;place-items:center;color:var(--muted)}
.bar{flex:1;height:16px;border-radius:99px;background:color-mix(in srgb,var(--muted) 22%,var(--surface));overflow:hidden}
.bar i{display:block;height:100%;min-width:16px;border-radius:99px;background:var(--good);position:relative;transition:width .4s cubic-bezier(.3,1.4,.6,1)}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:99px;background:rgba(255,255,255,.35)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{font:700 12px var(--f-text);padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:color-mix(in srgb,var(--c) 75%,var(--ink))}
.q{font-size:23px;line-height:1.28;margin:0 0 8px}
.ctx{color:var(--ink);opacity:.82;margin:0 0 14px;font-size:15.5px}
.ref{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin:0 0 20px}
.tblwrap{overflow-x:auto;margin:0 0 16px;background:var(--surface);border-radius:var(--r-md);box-shadow:inset 0 0 0 .5px var(--hair)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15px}
th,td{padding:9px 12px;text-align:center;white-space:nowrap}
th{font:600 12px var(--f-text);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
tbody tr{border-top:.5px solid var(--hair)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;padding:14px 16px;border-radius:var(--r-md);
  background:var(--surface);border:2px solid var(--hair);box-shadow:0 4px 0 var(--hair);font-size:16px;line-height:1.35;transition:transform .06s}
.opt:active:not([disabled]){transform:translateY(2px);box-shadow:0 2px 0 var(--hair)}
.opt .k{width:30px;height:30px;border-radius:9px;border:2px solid var(--hair);display:grid;place-items:center;font:800 14px var(--f-round);color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--sel-tint);box-shadow:0 4px 0 var(--blue)}
.opt[aria-pressed="true"] .k{border-color:var(--blue);color:var(--blue)}
.opt.is-right{border-color:var(--good);background:var(--good-tint);box-shadow:0 4px 0 var(--good)}
.opt.is-right .k{border-color:var(--good);color:var(--good)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-tint);box-shadow:0 4px 0 var(--bad)}
.opt.is-wrong .k{border-color:var(--bad);color:var(--bad)}
.opt[disabled]{cursor:default}
.numrow{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:var(--r-md);border:2px solid var(--hair);padding:4px 16px 4px 4px}
.numrow input{flex:1;min-width:0;font:800 24px var(--f-round);padding:12px;border:none;background:none;color:var(--ink)}
.numrow input:focus{outline:none}
.numrow:focus-within{border-color:var(--blue)}
.numrow .unit-l{color:var(--muted);font-weight:600}
textarea{width:100%;min-height:170px;font:16px/1.5 var(--f-text);padding:14px 16px;border-radius:var(--r-md);border:2px solid var(--hair);background:var(--surface);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--blue)}
.pts{list-style:none;margin:14px 0 0;padding:0;background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.pts li + li label{border-top:.5px solid var(--hair)}
.pts label{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;padding:12px 16px;cursor:pointer;font-size:15px}
.pts input{width:22px;height:22px;margin:0;accent-color:var(--good)}
.hint{font-size:13px;color:var(--muted);margin:10px 4px 0}

/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--ground);border-top:.5px solid var(--hair);
  padding-top:16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;max-height:62vh;overflow:auto}
.sheet-in #next,.sheet-in #grade,.sheet-in #go{position:sticky;bottom:0;flex:none}
.sheet.good{background:var(--good-tint);border-top-color:transparent}
.sheet.bad{background:var(--bad-tint);border-top-color:transparent}
.sheet.card{background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.12);border-top:none}
.verdict{display:flex;align-items:center;gap:10px;font:900 22px var(--f-round)}
.verdict .badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff}
.sheet.good .verdict{color:color-mix(in srgb,var(--good) 80%,var(--ink));--c:var(--good)}
.sheet.bad .verdict{color:color-mix(in srgb,var(--bad) 85%,var(--ink));--c:var(--bad)}
.fb{font-size:15.5px}
.fb .lbl{display:block;font:800 12px var(--f-round);text-transform:uppercase;letter-spacing:.06em;opacity:.7;margin-bottom:2px}
.fb.small{font-size:13px;color:var(--muted)}
.lvl-card h3{font-size:22px;color:var(--c)}
.lvl-card p{margin:4px 0 0;color:var(--muted)}
.meter{height:8px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,var(--surface));overflow:hidden;margin:8px 0 2px}
.meter i{display:block;height:100%;background:var(--c);border-radius:99px}
.pop{animation:pop .25s cubic-bezier(.3,1.5,.6,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.slide{animation:slide .22s ease-out}
@keyframes slide{from{transform:translateY(20px);opacity:.5}to{transform:none;opacity:1}}

/* summary */
.sum{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding-top:36px}
.trophy{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:var(--yellow);color:#fff;box-shadow:0 8px 0 color-mix(in srgb,var(--yellow) 68%,#000)}
.trophy svg{width:60px;height:60px}
.sum h2{font-size:30px;color:var(--yellow)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile{border-radius:var(--r-md);border:2px solid var(--c);overflow:hidden;background:var(--surface)}
.tile .h{background:var(--c);color:#fff;font:800 11px var(--f-round);text-transform:uppercase;letter-spacing:.06em;padding:5px}
.tile b{display:block;padding:10px 4px;font:900 22px var(--f-round);color:var(--c);font-variant-numeric:tabular-nums}
.sum .group{width:100%;text-align:left}

/* road + branch */
.road-edge{fill:none;stroke:var(--road-edge);stroke-linecap:round}
.road-top{fill:none;stroke:var(--road);stroke-linecap:round}
.node.sm b{font-size:24px;letter-spacing:-.02em}
/* extra training */
.extras{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.xcard{background:var(--surface);border-radius:var(--r-lg);padding:18px 10px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;min-width:0}
.xcard .ring{width:88px;height:88px;box-shadow:none}
.xcard .node{width:70px;height:66px}
/* figures */
.fig{background:var(--surface);border-radius:var(--r-md);box-shadow:inset 0 0 0 .5px var(--hair);margin:0 0 16px;padding:10px 8px 6px;overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;max-width:460px;margin:0 auto}
.fig .ax{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.fig .dash{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 4}
.fig .dem{stroke:var(--blue);stroke-width:2.8;stroke-linecap:round}
.fig .mr{stroke:var(--purple);stroke-width:2.2;stroke-linecap:round}
.fig .mc{stroke:var(--orange);stroke-width:2.8;stroke-linecap:round}
.fig .bud{stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.fig .bud2{stroke:var(--blue);stroke-width:2.6;stroke-linecap:round}
.fig .comp{stroke:var(--muted);stroke-width:2;stroke-dasharray:6 5}
.fig .u1,.fig .u2{fill:none;stroke:var(--teal);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.fig .u2{stroke-opacity:.75}
.fig .shade{fill:var(--yellow);fill-opacity:.5;stroke:none}
.fig .shade.ok{fill:var(--good);fill-opacity:.38}
.fig .pt{fill:var(--ink)}
.fig text{fill:var(--ink)}
.fig .lbl{font:900 14px var(--f-round);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.fig .tick{font:600 11px var(--f-text);fill:var(--muted)}
.fig .axl{font:700 12px var(--f-text);fill:var(--muted)}
.fig .cl{font:700 11px var(--f-text);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.fig .t-dem{fill:var(--blue)} .fig .t-mr{fill:var(--purple)} .fig .t-mc{fill:var(--orange)} .fig .t-u{fill:var(--teal)}
.numrow input.letters{text-transform:uppercase;letter-spacing:.18em}
.numrow input.letters::placeholder{text-transform:none;letter-spacing:0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:400px){.q{font-size:21px}.pill{padding:6px 6px}.brand small{display:none}}
@media (max-width:360px){.unit h2{font-size:17px}.brand{font-size:17px}}
/* nya frågetyper */
.tag.muted{--c:var(--muted)}
.mrows{display:flex;flex-direction:column;gap:12px}
.mrow{background:var(--surface);border-radius:var(--r-md);border:2px solid var(--hair);padding:12px 14px}
.mrow .mt{font:800 16px var(--f-round)}
.mrow .md{font-size:14px;color:var(--muted);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:2px solid var(--hair);background:var(--surface-2);border-radius:99px;padding:6px 12px;font:700 13.5px var(--f-text);box-shadow:0 2px 0 var(--hair)}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--sel-tint);color:var(--blue);box-shadow:0 2px 0 var(--blue)}
.chip.is-right{border-color:var(--good);background:var(--good-tint);color:color-mix(in srgb,var(--good) 70%,var(--ink));box-shadow:0 2px 0 var(--good)}
.chip.is-wrong{border-color:var(--bad);background:var(--bad-tint);color:color-mix(in srgb,var(--bad) 75%,var(--ink));box-shadow:0 2px 0 var(--bad)}
.chip[disabled]{cursor:default}
.mrow.ok{border-color:var(--good)} .mrow.no{border-color:var(--bad)}
.scale{display:flex;justify-content:space-between;font:700 12px var(--f-text);color:var(--muted);margin:0 2px 10px}
.cloze{background:var(--surface);border-radius:var(--r-md);padding:16px;font-size:17px;line-height:2.1;margin:0 0 16px;box-shadow:inset 0 0 0 .5px var(--hair)}
.blank{display:inline-block;min-width:96px;padding:0 10px;margin:0 2px;border:none;border-bottom:3px solid var(--muted);border-radius:8px 8px 2px 2px;background:var(--surface-2);font:800 15px var(--f-round);line-height:1.9;vertical-align:baseline;text-align:center}
.blank.act{border-bottom-color:var(--blue);background:var(--sel-tint)}
.blank.fill{color:var(--blue)}
.blank.is-right{border-bottom-color:var(--good);background:var(--good-tint);color:color-mix(in srgb,var(--good) 70%,var(--ink))}
.blank.is-wrong{border-bottom-color:var(--bad);background:var(--bad-tint);color:color-mix(in srgb,var(--bad) 75%,var(--ink))}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.bank .chip{font-size:15px;padding:8px 14px}
.bank .chip.used{opacity:.3}
.step2{margin-top:22px;padding-top:18px;border-top:.5px solid var(--hair)}
.step2 .q{font-size:19px}
.stop.todo .node{background:var(--surface);color:var(--muted);box-shadow:0 6px 0 var(--hair),inset 0 0 0 2.5px var(--hair);border:2.5px dashed color-mix(in srgb,var(--muted) 60%,transparent)}
.stop.todo .ring{background:var(--surface-2)}
.count{font:900 34px var(--f-round);line-height:1;letter-spacing:-.02em}
.unit .row2{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.unit .row2>div:first-child{min-width:0}.unit .count{flex:none}
.unit .count small{display:block;font:700 12px var(--f-text);opacity:.85;letter-spacing:0;text-align:right}

<script>
/* ================= KURSDATA =================
   Uppdateras av Claude när en föreläsning eller ett quiz laddas upp.
   Fält per fråga: id, f (föreläsning nr eller null), s (sidostopp: "t24" | "aberg" | null),
   l (1 grund, 2 begrepp i fall, 3 tentanivå), t (begrepp), r (källa), type, chk (kontrollerad mot föreläsning),
   mc: q,o,a | multi: q,o,a[] | tfw: q,a(bool),then{q,o,a,why} | match: q,cats,items[{t,d,a}],scale
   cloze: q,text med {ord},extra[] | text: q,pts[] — plus why och alt (ny vinkel vid fel). */
const COURSE={name:"Arbetsmarknadssociologi",brand:"AKPA Sociologi",exam:"2026-11-27",examTxt:"27 nov"};
const LECT=[
  {n:1,title:"Arbetsvilja och arbetsmiljö"},
  {n:2,title:"Organisation och ledarskap"},
  {n:3,title:"Klassanalys"},
  {n:4,title:"Teknik, kunskap och anställningar"}
];
const SIDE={
  t24:{name:"Tenta 24/25",g:"24",c:"var(--purple)",size:10,desc:"Frågor från tentan 6 december 2024. Flyttas in i rätt föreläsning när den laddas upp."},
  pers:{name:"Personer",g:"P",c:"var(--pink)",size:10,desc:"Alla personer från föreläsningarna: vem sa vad, och vad förknippas de med. Fylls på när nya föreläsningar kommer."}
};
const T24="Tenta 24/25";
const Q=[
/* ---------- TENTA 24/25 · uppgift 1 (flerval) ---------- */
{id:"t01",f:null,s:"t24",l:3,t:"Utbuds- och efterfrågeteorier",r:T24+" · uppg. 1",type:"mc",chk:true,
 q:"Vilken teori förklarar könslöneskillnader genom diskriminering och kulturella uppfattningar hos arbetsgivaren?",
 o:["Efterfrågeteorier","Utbudsteorier","Neoklassisk ekonomisk teori"],a:0,
 why:"Arbetsgivaren står för efterfrågan på arbetskraft. Förklaringar som bygger på vad arbetsgivaren tror eller gör (diskriminering, föreställningar om kön) är efterfrågeteorier. Utbudsteorier förklarar skillnaden med arbetstagarnas egna val, t.ex. utbildning och yrke.",
 alt:"Fråga dig: vems beteende förklarar teorin? Chefen som väljer vem som får passen = efterfrågan. Bartendern som själv väljer bort helgpass = utbud."},
{id:"t02",f:null,s:"t24",l:3,t:"Goldin",r:T24+" · uppg. 1",type:"mc",chk:true,
 q:"Vilken faktor bidrar enligt Goldin till större löneskillnader mellan könen?",
 o:["Långa arbetstimmar","Mindre face-time arbete","Hög arbetsflexibilitet"],a:0,
 why:"Goldin: många yrken belönar långa, oflexibla arbetstimmar och närvaro oproportionerligt mycket. Den som tar störst familjeansvar, oftast kvinnan, kan inte jobba så och tappar mer i lön än bara de förlorade timmarna.",
 alt:"Mindre face-time och mer flexibilitet är lösningen hos Goldin, inte orsaken. Tänk på en bar där den som alltid tar sena helgpass får de bästa skiften: den som inte kan jobba sent förlorar mer än timmarna."},
{id:"t03",f:null,s:"t24",l:3,t:"Goldin",r:T24+" · uppg. 1",type:"mc",chk:true,
 q:"Vad är huvudfokus i Claudia Goldins teori om arbetsmarknadsflexibilitet?",
 o:["Att ökad flexibilitet kan minska könslöneskillnader","Att ökad flexibilitet minskar produktiviteten på arbetsplatsen","Att flexibilitet bara spelar roll för könslöneskillnader om både kvinnor och män utnyttjar den"],a:0,
 why:"Om arbetet kan organiseras så att det inte straffar den som jobbar färre eller flexiblare timmar, krymper löneskillnaden. Det är Goldins kärnpoäng.",
 alt:"Koppla till förra frågan: om långa oflexibla timmar ökar gapet, vad minskar det då? Det omvända, flexibilitet."},
{id:"t04",f:null,s:"t24",l:3,t:"Könslöneskillnader",r:T24+" · uppg. 1",type:"mc",chk:true,
 q:"Vilken faktor anses bidra till att könslöneskillnaderna är större i högkvalificerade yrken?",
 o:["Konsekvenserna av kvinnors familjeansvar blir allvarligare i yrken med höga krav","Kvinnor arbetar deltid","Andelen kvinnor i högkvalificerade jobb har ökat de senaste 30 åren"],a:0,
 why:"I yrken med höga krav på tid och tillgänglighet blir straffet för att dra ner störst. Familjeansvaret slår därför hårdast där, och gapet blir större.",
 alt:"Deltid förklarar skillnader generellt, men frågan gäller varför skillnaden är just större i högkvalificerade yrken. Svaret måste säga något om de yrkena."},
{id:"t05",f:null,s:"t24",l:3,t:"Maktresursansatsen",r:T24+" · uppg. 1",type:"mc",chk:true,
 q:"Vad innebär maktresursansatsen inom arbetsmarknadsteori?",
 o:["En teori som förklarar arbetsmarknadsrelationer genom maktfördelningen mellan olika sociala grupper","En strategi där arbetsgivare använder ekonomiska resurser för att styra arbetsmarknaden","En arbetsmarknadsstrategi som baseras på statlig intervention"],a:0,
 why:"Ansatsen är en förklaringsteori, ingen strategi: arbetsmarknadens institutioner speglar hur makten är fördelad mellan grupper, främst löntagare och arbetsgivare. Starka fack ger t.ex. hög kollektivavtalstäckning.",
 alt:"Två av alternativen beskriver strategier, alltså vad någon gör. Ansatsen förklarar varför arbetsmarknaden ser ut som den gör."},
{id:"t06",f:null,s:"t24",l:3,t:"Arbetsmarknadsmodeller",r:T24+" · uppg. 1",type:"mc",chk:true,
 q:"Vilket alternativ beskriver bäst den kontinentaleuropeiska arbetsmarknadsmodellen?",
 o:["Relativt starkt lagstödd arbetsrätt och omfattande lagstiftning om anställningsskydd","Minimal statlig inblandning och låg regleringsgrad av arbetsförhållanden","Decentraliserade förhandlingar med låg inblandning av arbetsgivare"],a:0,
 why:"Den kontinentala modellen reglerar mer genom lag. Den nordiska reglerar mer genom kollektivavtal mellan starka parter. Minimal reglering beskriver snarare den liberala modellen.",
 alt:"Tre modeller: nordisk = avtal, kontinental = lag, liberal = marknad."},
{id:"t07",f:null,s:"t24",l:3,t:"Arbetsmarknadsmodeller",r:T24+" · uppg. 1",type:"mc",chk:true,
 q:"Vad är särskilt kännetecknande för den nordiska arbetsmarknadsmodellen?",
 o:["Starka fackföreningar och hög kollektivavtalstäckningsgrad","Svaga fackföreningar och låg kollektivavtalstäckningsgrad","Centraliserade löneförhandlingar utan inblandning av fackföreningar"],a:0,
 why:"Kärnan i den nordiska modellen är att parterna, fack och arbetsgivare, själva reglerar villkoren i kollektivavtal som täcker nästan alla anställda.",
 alt:"Ditt jobb i baren regleras troligen av ett kollektivavtal (t.ex. för hotell och restaurang) och inte av en lag om lön. Det är den nordiska modellen."},
{id:"t08",f:null,s:"t24",l:3,t:"Märket",r:T24+" · uppg. 1",type:"mc",chk:true,
 q:"Vad innebär ”märket” i svenska löneförhandlingar?",
 o:["En norm för löneökningar som sätts av industrisektorn och används som riktmärke i andra sektorer","Ett statligt fastställt lönetak som inte får överskridas","En minimilön som alla arbetsgivare är lagligt bundna att följa"],a:0,
 why:"Den konkurrensutsatta industrin förhandlar först. Dess löneökning blir märket, normen som övriga avtal förhåller sig till. Staten sätter varken tak eller minimilön.",
 alt:"Båda felalternativen handlar om staten. I den nordiska modellen sätter parterna lönerna, inte staten."},
{id:"t09",f:3,s:"t24",l:3,t:"Exploatering och Goldthorpe",r:T24+" · uppg. 1",type:"mc",chk:true,
 q:"Vad betyder exploatering och vilken roll har det i Goldthorpes klassteori?",
 o:["En klass tillägnar sig mervärdet som en annan klass skapar. Goldthorpe betonar inte detta, vilket är en central skillnad mellan neo-marxistisk och neo-weberiansk klassteori","En klass tillägnar sig mervärdet som en annan klass skapar. Goldthorpe betonar detta, vilket är en central skillnad mellan neo-marxistisk och neo-weberiansk klassteori","En klass har en marknadsmässig fördel över en annan. Goldthorpe betonar detta, vilket är en likhet mellan neo-marxistisk teori och neoklassisk nationalekonomi"],a:0,
 why:"Exploatering är ett marxistiskt begrepp och centralt för Wright. Goldthorpe är neo-weberian och utgår från anställningsrelationen, inte från exploatering. Just där skiljer sig skolorna.",
 alt:"Marx/Wright: vem tar värdet som arbetet skapar? Weber/Goldthorpe: vilken sorts anställningskontrakt har du?"},
{id:"t10",f:4,s:"t24",l:3,t:"Industriellt och IT-paradigm",r:T24+" · uppg. 1",type:"mc",chk:true,
 q:"Vad är lösningen på det ”tekniska problemet” i det industriella paradigmet respektive IT-paradigmet?",
 o:["Industriellt: kontroll. IT: anpassning","Industriellt: anpassning. IT: kontroll","Båda har anpassning som huvudsaklig lösning"],a:0,
 why:"Industrin löste produktionen med kontroll: standardisering, planering och styrning ovanifrån. IT-paradigmet möter skiftande marknader med anpassning och flexibilitet.",
 alt:"Löpande bandet är kontroll. En kod som ändras efter kundens önskemål varje vecka kräver anpassning."},
{id:"t11",f:4,s:"t24",l:3,t:"Atkinson",r:T24+" · uppg. 1",type:"mc",chk:true,
 q:"Vad innebär numerär flexibilitet?",
 o:["Förmågan att ändra organisationens storlek","Möjligheten att ändra arbetsuppgifter","Flexibilitet i användningen av maskinell teknik"],a:0,
 why:"Atkinson: numerär flexibilitet = ändra antalet anställda, t.ex. med visstid, inhyrda och timanställda. Att ändra vad de anställda gör är funktionell flexibilitet.",
 alt:"Restaurangen som kallar in fler timanställda en fredag än en tisdag använder numerär flexibilitet: antalet varierar, inte uppgifterna."},
{id:"t12",f:2,s:"t24",l:3,t:"Taylorism",r:T24+" · uppg. 1",type:"mc",chk:true,
 q:"Vad karaktäriserar Taylorismens syn på arbetsorganisation?",
 o:["Standardisering och effektivisering genom noggrann planering","Flexibilitet och anpassning efter skiftande marknader","Hög grad av autonomi och specialisering bland anställda"],a:0,
 why:"Taylor ville hitta det bästa sättet att utföra varje moment, planerat av ledningen och utfört standardiserat. Planering skiljs från utförande, och den anställde får lite autonomi.",
 alt:"Autonomi är motsatsen till Taylorism. Flexibilitet hör till senare paradigm."},
{id:"t13",f:2,s:"t24",l:3,t:"Sociotekniska skolan",r:T24+" · uppg. 1",type:"mc",chk:true,
 q:"Vilken styrningsform betonas i den sociotekniska skolan?",
 o:["Ömsesidig anpassning och självstyrande grupper","Direkt övervakning av arbetsprocessen","Trappstegsmodellen"],a:0,
 why:"Den sociotekniska skolan vill anpassa tekniken och de sociala relationerna till varandra. Gruppen styr själv hur arbetet fördelas och utförs.",
 alt:"Direkt övervakning är Taylor och Ford. Socioteknik är motreaktionen: ge gruppen kontroll."},
{id:"t14",f:1,s:"t24",l:3,t:"Karasek",r:T24+" · uppg. 1",type:"mc",chk:true,
 q:"Hur kan arbetsgivare bäst använda Karaseks modell för att förbättra de anställdas välbefinnande?",
 o:["Balansera arbetskraven med egen kontroll och stöd","Öka arbetskraven och minska isolerade högstressarbeten","Minska kraven på de anställda"],a:0,
 why:"Enligt krav–kontroll(–stöd)-modellen är höga krav inte farliga i sig. Det är höga krav tillsammans med låg kontroll och lite stöd som ger ohälsa. Att bara sänka kraven riskerar att ge passiva jobb.",
 alt:"En fredagsrusch i baren går att hantera om du styr din station själv och kollegorna backar upp. Samma rusch med en chef som detaljstyr och ingen hjälp sliter."},
{id:"t15",f:4,s:"t24",l:3,t:"Atkinson",r:T24+" · uppg. 1",type:"mc",chk:true,
 q:"Vad innebär funktionsflexibilitet enligt Atkinsons modell?",
 o:["Anpassning genom breddning av jobbens innehåll och arbetsrotation","Möjligheten att öka eller minska antalet anställda med kort varsel","Permanent reducering av arbetsstyrkans storlek"],a:0,
 why:"Funktionell flexibilitet = samma personer gör fler sorters uppgifter. Kärnarbetskraften får det. Att ändra antalet är numerär flexibilitet.",
 alt:"Bartendern som också kan stå i kassan och ta hand om bokningar när det behövs = funktionell flexibilitet."},
{id:"t16",f:2,s:"t24",l:3,t:"McGregor",r:T24+" · uppg. 1",type:"mc",chk:true,
 q:"Hur kan Fordism kopplas till McGregors teorier?",
 o:["Den stödjer Teori X genom direktstyrning och yttre incitament","Den stödjer Teori Y genom att främja autonomi och initiativ","Den stödjer Teori Z som betonar sociala relationer"],a:0,
 why:"Teori X antar att människor ogillar arbete och måste styras och belönas utifrån. Fordismens löpande band med detaljstyrning och lön som drivkraft passar den. Teori Y antar att människor söker ansvar.",
 alt:"Teori Z är inte McGregors. Det räcker att skilja X (styr och kontrollera) från Y (lita på och ge ansvar)."},
{id:"t17",f:2,s:"t24",l:3,t:"Karasek och självbestämmandeteori",r:T24+" · uppg. 1",type:"mc",chk:true,
 q:"Vad är en central likhet mellan Karaseks krav–kontroll-modell och självbestämmandeteorin?",
 o:["Båda ser arbetsmiljön som central och hur den präglas av utmaningar samt stöd, styrning och kontroll från överordnade","Båda pekar på strukturella förklaringar till ökat självbestämmande i samhället och individens kontrafaktiska val","Båda ser samspelet mellan arbetsmiljön och stabila personlighetsdrag som centralt för hälsa, motivation och prestation"],a:0,
 why:"Båda teorierna förklarar utfall med hur arbetet är utformat: krav, kontroll och stöd hos Karasek, och om miljön stöder eller styr autonomin i självbestämmandeteorin. Ingen av dem bygger på stabila personlighetsdrag.",
 alt:"Leta efter det gemensamma ordet: arbetsmiljö. Personlighetsdrag är en fälla: båda teorierna handlar om situationen, inte om personen."},
{id:"t18",f:null,s:"t24",l:3,t:"Könssegregation och ohälsa",r:T24+" · uppg. 1",type:"mc",chk:false,
 q:"Vilken konsekvens av könssegregation kan kopplas till arbetsrelaterad ohälsa?",
 o:["Kvinnor i kvinnodominerade yrken riskerar högre grad av psykisk ohälsa och stress","Män i mansdominerade yrken upplever lägre stressnivåer än kvinnor","Kvinnor i mansdominerade yrken rapporterar fler arbetsrelaterade skador"],a:0,
 why:"Kvinnodominerade yrken (t.ex. vård, omsorg, skola) har ofta höga krav, låg kontroll och emotionellt krävande arbete. Det ger mer stress och psykisk ohälsa. Koppla till Karasek.",
 alt:"Segregationen gör att kvinnor och män möter olika arbetsmiljöer. Fråga dig: vilka arbetsmiljöer har höga krav och låg kontroll?"},
{id:"t19",f:1,s:"t24",l:3,t:"Arbetstillfredsställelse",r:T24+" · uppg. 1",type:"mc",chk:true,
 q:"Vilken är en central skiljelinje mellan teorierna om arbetstillfredsställelse på kursen (t.ex. Herzberg, Locke, Vroom, Adams)?",
 o:["Att se människor som i grunden likartade i vad de uppskattar i arbetet, eller att erkänna att människor är olika i det avseendet","Teorier som bara fokuserar på materiella aspekter, eller teorier som även lyfter icke-materiella belöningar som prestige och status","Teorier från industrisamhället där alienation var centralt, eller teorier från IT-samhället om digitala aspekter av arbetet"],a:0,
 why:"Herzberg ser behoven som naturliga och lika för alla: basala behov först, sedan inre motivation. Locke menar att behov inte är givna av naturen utan är rationella värderingar, och Vroom och Adams lägger till förväntningar och jämförelser. Individerna skiljer sig alltså åt.",
 alt:"Fråga om två kollegor blir lika nöjda av samma sak. Svarar teorin ja eller ”det beror på personen”?"},
{id:"t20",f:null,s:"t24",l:3,t:"Diskriminering",r:T24+" · uppg. 1",type:"mc",chk:true,
 q:"Vilken typ av diskriminering bygger på att arbetsgivaren använder gruppinformation i brist på information om individen?",
 o:["Statistisk diskriminering","Preferensdiskriminering","Implicit diskriminering"],a:0,
 why:"Statistisk diskriminering: arbetsgivaren vet för lite om den sökande och använder gruppens genomsnitt i stället. Preferensdiskriminering: arbetsgivaren ogillar gruppen i sig.",
 alt:"Nyckelordet är ”i brist på information”. Statistisk = gissar utifrån genomsnitt. Preferens = vill inte, oavsett information."},
{id:"t21",f:null,s:"t24",l:3,t:"Intersektionalitet",r:T24+" · uppg. 1",type:"mc",chk:true,
 q:"Vad är en implikation av intersektionalitetsperspektivet på arbetsmarknadsutfall?",
 o:["Kombinationer av klass, kön och etnicitet bör studeras för att förklara utfallen","Etnicitet är den mest betydande faktorn","Jämfört med klass är etnicitet en mer betydande faktor"],a:0,
 why:"Intersektionalitet innebär att kategorierna samverkar. Ingen av dem rangordnas som den viktigaste.",
 alt:"Båda felalternativen pekar ut en vinnare. Intersektionalitet handlar om korsningen, inte om en vinnare."},
{id:"t22",f:4,s:"t24",l:3,t:"Tjänstesamhället",r:T24+" · uppg. 1",type:"mc",chk:true,
 q:"Hur kan ekonomisk utveckling kopplas till efterfrågan på tjänster?",
 o:["Tillväxt leder ofta till ökad efterfrågan på både personliga och professionella tjänster","Den ökar främst efterfrågan på grundläggande tjänster som mat och boende","Den minskar efterfrågan på tjänster eftersom konsumenterna blir mer självförsörjande"],a:0,
 why:"Med högre inkomster köper hushåll och företag mer tjänster av alla slag, från restaurang och omsorg till konsulter och juridik. Det driver tjänstesektorns tillväxt.",
 alt:"Varför fanns det fler cocktailbarer i Stockholm än för 50 år sedan? Folk har råd att köpa upplevelser och service i stället för att göra allt själva."},
{id:"t23",f:2,s:"t24",l:3,t:"Självbestämmandeteori",r:T24+" · uppg. 1",type:"mc",chk:true,
 q:"Vilket påstående beskriver skillnaden mellan autonom och kontrollerad motivation i självbestämmandeteorin?",
 o:["Skillnaden är kontinuerlig: motivation varierar längs ett spektrum från helt autonom till helt kontrollerad","Skillnaden är absolut: en individ är antingen autonomt eller kontrollerat motiverad","Det finns ingen vetenskaplig konsensus om skillnaden är absolut eller kontinuerlig"],a:0,
 why:"Självbestämmandeteorin är en skala: amotivation, yttre reglering, introjicerad, identifierad, integrerad, inre motivation. Därför kan man placera Stefan, Peter och Felix på olika ställen på den, som i uppgift 2.",
 alt:"Om skillnaden var absolut skulle det inte gå att göra uppgiften där personer placeras ut på en skala."},
{id:"t24",f:4,s:"t24",l:3,t:"Oesch",r:T24+" · uppg. 14",type:"mc",chk:true,
 q:"Inom vilken klassteori förekommer resonemanget att klientorientering är ett viktigt incitament för arbete inom vissa klasser?",
 o:["Oesch","Goldthorpe","Både Oesch och Goldthorpe"],a:0,
 why:"Oesch delar in arbete efter arbetslogik. I den mellanmänskliga logiken (vård, undervisning, service) är relationen till klienten själva drivkraften. Goldthorpe utgår från anställningskontraktet och övervakningsproblemet.",
 alt:"Klient = mellanmänsklig. Mellanmänsklig arbetslogik = Oesch."},
/* ---------- uppgift 2: placera på skala ---------- */
{id:"t30",f:2,s:"t24",l:3,t:"Självbestämmandeteori",r:T24+" · uppg. 2",type:"match",scale:true,chk:true,
 q:"Placera personerna på självbestämmandeteorins skala.",
 cats:["Amotivation","Extern","Introjicerad","Identifierad","Integrerad","Intrinsikal"],
 items:[{t:"Mårten",d:"Reklamutdelare som inte gör något alls, ingen kontrollerar honom.",a:0},
  {t:"Göran",d:"Duschar patienterna bara när kollegan som kan rapportera honom är på jobbet.",a:1},
  {t:"Felix",d:"Drivs av skuld och rädsla för att inte duga i pappas ögon.",a:2},
  {t:"Stefan",d:"Jobbet har blivit tråkigt, men han förstår att det är viktigt och går dit av plikt.",a:3},
  {t:"Peter",d:"Ser undervisningen som en del av sitt större mål och tar gärna på sig uppgiften.",a:4},
  {t:"Jesper",d:"Analyserar börsen för att det är roligt i sig och glömmer att posta resultaten.",a:5}],
 why:"Extern = direkta belöningar och straff (Göran och kollegan). Introjicerad = att känna sig värdefull och duktig i andras ögon, här skuld och rädsla för pappans omdöme (Felix). Identifierad = utfallet upplevs som viktigt och i enlighet med ens värderingar (Stefan). Integrerad = vitalt och fullständigt i enlighet med ens värderingar (Peter). Intrinsikal = intressant och lustfylld i sig (Jesper).",
 alt:"Gå från vänster: ingen drivkraft → någon annan tvingar → jag tvingar mig själv → jag förstår varför → det är den jag är → det är kul i sig."},
/* ---------- uppgift 3: klasscheman ---------- */
{id:"t31",f:3,s:"t24",l:3,t:"Klasscheman",r:T24+" · uppg. 3",type:"match",chk:true,
 q:"Vilket klasschema bygger på vilken dimension?",
 cats:["Goldthorpe","Wright","Oesch"],
 items:[{t:"Övervakningsmöjligheter",d:"Hur lätt arbetet kan övervakas",a:0},
  {t:"Organisationsspecifik kompetens",a:0},
  {t:"Ägare/arbetsgivare eller anställd",a:1},
  {t:"Auktoritet",d:"Antal underställda",a:1},
  {t:"Expertnivå",d:"Utbildningskrav",a:1},
  {t:"Arbetslogik",d:"Teknisk, organisatorisk, mellanmänsklig",a:2}],
 why:"Goldthorpe (F3): övervakningsmöjligheter och organisationsspecifik kompetens ger olika anställningskontrakt. Wright (F3): ägare eller anställd, och bland anställda auktoritet och expertnivå. Oesch (F4): arbetslogik – teknisk, organisatorisk, mellanmänsklig – som horisontell dimension. Den korsas med kompetensnivå.",
 alt:"I tentans figur ligger auktoritet vid Wrights tabell (”chefer med yrkesutbildning”), och Oeschs tabell har kolumnerna teknisk, organisatorisk och mellanmänsklig."},
/* ---------- uppgift 12: lojalitet och incitament ---------- */
{id:"t32",f:3,s:"t24",l:3,t:"Organisationslojalitet",r:T24+" · uppg. 12",type:"match",chk:true,
 q:"Vilken typ av incitament förklarar bäst vilken form av organisationslojalitet?",
 cats:["Gåva som incitament","Indirekt kontroll som incitament"],
 items:[{t:"Normativ organisationslojalitet",d:"Man stannar för att man känner sig förpliktad eller delar organisationens värden",a:0},
  {t:"Instrumentell organisationslojalitet",d:"Man stannar för vad man får ut av det",a:1}],
 why:"F3: långsiktigheten i anställningen är en gåva som gör att den anställde känner sig skyldig att betala tillbaka. Det är normativ lojalitet (F1: upplever sig skyldig organisationen något). F3: indirekt kontroll ger framtida belöningar om du är lojal, alltså instrumentell organisationslojalitet.",
 alt:"Normativ = ”jag borde”. Gåva skapar ett ”jag borde ge tillbaka”. Instrumentell = ”det lönar sig”. Indirekt kontroll gör att det lönar sig."},
/* ---------- uppgift 5–6 och 7–8: sant/falskt + varför ---------- */
{id:"t40",f:null,s:"t24",l:3,t:"Könssegregering",r:T24+" · uppg. 5–6",type:"tfw",chk:false,
 q:"Yrkessegregeringen mellan män och kvinnor har minskat markant både vertikalt och horisontellt de senaste decennierna, särskilt i arbetaryrken. Det beror främst på att män har ändrat sina yrkesval.",
 a:false,
 then:{q:"Varför är påståendet falskt?",
  o:["Minskningen beror främst på att kvinnor har gått in i mansdominerade yrken, medan män i liten utsträckning har gått in i kvinnodominerade", "Segregeringen har i själva verket ökat de senaste decennierna, eftersom både män och kvinnor i högre grad väljer könstypiska yrken", "Minskningen beror främst på att många kvinnodominerade yrken har försvunnit när den offentliga sektorn har krympt", "Män har ändrat sina yrkesval, men bara vertikalt: fler män har gått in i chefspositioner inom kvinnodominerade yrken"],a:0,
  why:"Det är kvinnorna som har ändrat sina yrkesval. Män stannar i högre grad kvar i mansdominerade yrken, delvis på grund av könssocialisering och att kvinnodominerade yrken har lägre lön och status."},
 why:"Påståendet är falskt.",
 alt:"På tentan ger motiveringen bara poäng om sant/falskt är rätt. Fråga dig: vem har rört sig in på den andres område?"},
{id:"t41",f:null,s:"t24",l:3,t:"Humankapital utrikesfödda",r:T24+" · uppg. 7–8",type:"tfw",chk:true,
 q:"Utrikes födda, särskilt de från Europa som har varit länge i Sverige, upplever ingen märkbar tillfällig förlust av sitt humankapital, eftersom deras utbildningar och erfarenheter är likvärdiga med humankapital som skaffats i Sverige.",
 a:false,
 then:{q:"Varför är påståendet falskt?",
  o:["Humankapital är delvis landspecifikt (språk, nätverk, erkännande av utbildning) och kan inte föras över fullt ut, så en tillfällig förlust uppstår även för dessa grupper", "Utbildningar från Europa är generellt sämre än svenska, så förlusten är permanent och beror på lägre kvalitet i utbildningen", "Humankapitalet försvinner helt vid migration och kan aldrig återvinnas, oavsett hur länge personen har bott i Sverige", "Förlusten gäller bara arbetslivserfarenhet, eftersom utbildningar från EU erkänns automatiskt av alla svenska arbetsgivare"],a:0,
  why:"Delar av humankapitalet är landspecifika och går inte att ta med sig fullt ut: språk, kontakter, kunskap om arbetsmarknaden och värdering av examina. Därför uppstår en tillfällig förlust som minskar med tiden i landet."},
 why:"Påståendet är falskt.",
 alt:"Nyckelordet är ”ingen”. Det räcker att visa att det finns en tillfällig förlust även för den mest gynnade gruppen."},
/* ---------- lucktext byggd på uppgift 1 ---------- */
{id:"t50",f:null,s:"t24",l:3,t:"Arbetsorganisation",r:T24+" · uppg. 1 (lucktext)",type:"cloze",chk:true,
 q:"Fyll i luckorna.",
 text:"Enligt Atkinson innebär {numerär} flexibilitet att organisationens storlek ändras, medan {funktionell} flexibilitet betyder breddade arbetsuppgifter och arbetsrotation. Taylorismen bygger på {standardisering} och noggrann planering, och Fordismen passar McGregors {Teori X}. Den sociotekniska skolan betonar i stället {självstyrande grupper}.",
 extra:["Teori Y","direkt övervakning","anpassning"],
 why:"Numerär = antal, funktionell = innehåll. Taylor och Ford = standardisering och kontroll, alltså Teori X. Socioteknik = gruppen styr själv.",
 alt:"Gör det i ordning: storlek → numerär. Innehåll → funktionell. Löpande band → Teori X. Motreaktionen → grupper."}
];

/* ================= F1 · ARBETSDELNING, ARBETSVILJA OCH ARBETSMILJÖ ================= */
Q.push(
{id:"f1-01",f:1,l:1,t:"Durkheim",r:"F1 · Hur arbetsdelningen påverkar varför vi arbetar (slide 6)",type:"mc",chk:true,
 q:"Vad innebär arbetsdelningen enligt Emile Durkheim?",
 o:["Ett större beroende av varandra, där starka arbetsnormer (”alla måste dra sitt strå till stacken”) blir ett samhällskitt", "Att den naturliga inre arbetsviljan urholkas, så att människan blir ett utbytbart kugghjul som är exploaterat och alienerat", "Att arbetsviljan kommer ur ideologi som den lutherska arbetsetiken, men riskerar att stelna till regler och kalkyler", "Att människor blir mindre beroende av varandra, eftersom var och en specialiserar sig och klarar sin egen uppgift"],a:0,
 why:"Durkheim ser arbetsdelningen som något som binder ihop samhället: vi blir beroende av varandra, och normen att alla gör sin plikt håller ihop det.",
 alt:"Baren fungerar bara om bartendern, servitören, kocken och diskaren gör sin del. Ingen klarar sig utan de andra. Det beroendet är Durkheims poäng."},
{id:"f1-02",f:1,l:1,t:"Marx",r:"F1 · Hur arbetsdelningen påverkar varför vi arbetar (slide 6)",type:"mc",chk:true,
 q:"Hur påverkar arbetsdelningen arbetsviljan enligt Karl Marx?",
 o:["Den urholkar den ”naturliga” inre arbetsviljan: människan blir ett utbytbart kugghjul, exploaterad och alienerad", "Den gör oss mer beroende av varandra, och starka arbetsnormer (”alla måste dra sitt strå till stacken”) blir ett samhällskitt", "Den stärker arbetsviljan genom ideologi som den lutherska arbetsetiken, men riskerar att göra arbetet regelstyrt", "Den ökar självförverkligandet: när alla får specialisera sig blir arbetet mer meningsfullt och arbetsviljan växer"],a:0,
 why:"Marx: när arbetet delas upp i små delar förlorar människan kontrollen över och meningen med arbetet. Hen blir utbytbar, exploaterad och alienerad.",
 alt:"Tänk på att bara skära lime åtta timmar om dagen utan att någonsin få blanda en drink. Du är ett kugghjul. Det är alienation."},
{id:"f1-03",f:1,l:1,t:"Weber",r:"F1 · Weber (slide 7)",type:"mc",chk:true,
 q:"Vad menar Weber med ”rationalitetens järnbur”?",
 o:["Att arbetsviljan i det moderna samhället riskerar att bli mekanisk och styrd av regler och kalkyler i stället för av kreativitet och initiativ", "Att arbetarna är fångade i ett beroende av kapitalägarna, som tillägnar sig mervärdet av det arbete som arbetarna utför", "Att arbetsdelningen gör människor beroende av varandra, så att starka arbetsnormer håller ihop det moderna samhället", "Att arbetslösa förlorar struktur för dagen, sociala kontakter och status, och därför mår sämre än de som arbetar"],a:0,
 why:"Weber menar att stark arbetsvilja kan komma ur ideologi (den lutherska arbetsetiken, ”man ska göra rätt för sig”), men att den i det moderna samhället riskerar att stelna till regler och kalkyler: järnburen.",
 alt:"Beroende av kapitalägare är Marx. Beroende av varandra är Durkheim. Weber handlar om idéer och regler."},
{id:"f1-04",f:1,l:1,t:"Durkheim, Marx och Weber",r:"F1 · slide 6–7",type:"match",chk:true,
 q:"Vem står för vilken syn på arbetsdelning och arbetsvilja?",
 cats:["Durkheim","Marx","Weber"],
 items:[{t:"Arbetsnormer som samhällskitt",d:"Alla måste dra sitt strå till stacken",a:0},
  {t:"Alienation och exploatering",d:"Människan blir ett utbytbart kugghjul",a:1},
  {t:"Arbetsvilja ur ideologi",d:"Luthersk arbetsetik, ”spirit of capitalism”",a:2},
  {t:"Rationalitetens järnbur",a:2},
  {t:"Anomie",d:"Känslan av att sakna funktion och inte vara del av en gemenskap",a:0}],
 why:"Durkheim: beroende, normer och, när det brister, anomie. Marx: arbetsdelningen urholkar arbetsviljan. Weber: arbetsvilja ur ideologi och risken för järnburen.",
 alt:"Durkheim = samhället som organism. Marx = konflikt och alienation. Weber = idéer och rationalitet."},
{id:"f1-05",f:1,l:1,t:"Arbetsdelning",r:"F1 · Vad arbetar människor med? (slide 5)",type:"mc",chk:true,
 q:"Vad innebär hög arbetsdelning?",
 o:["Att människor utför få och specifika typer av uppgifter","Att människor utför många olika och överlappande typer av uppgifter","Att alla anställda delar på ledningsansvaret","Att arbetet delas lika mellan män och kvinnor"],a:0,
 why:"Hög arbetsdelning = få, specifika uppgifter per person. Låg arbetsdelning = många olika och överlappande uppgifter.",
 alt:"En stor hotellbar med separat barback, bartender och kassör har hög arbetsdelning. En liten bar där en person gör allt har låg."},
{id:"f1-06",f:1,l:1,t:"Arbetets sociala funktion",r:"F1 · Arbetets sociala funktion, Jahoda (slide 9)",type:"mc",chk:true,
 q:"Enligt Jahoda fyller arbete en social funktion. Vilket hör INTE till den?",
 o:["Högre inkomst än arbetslöshetsersättningen","Sociala kontakter","Struktur för dagen","Status och identitet i den sociala gruppen"],a:0,
 why:"Jahodas poäng är att arbete ger mer än pengar: sociala kontakter, ett gemensamt projekt att utföra och organisera, struktur för dagen samt status och identitet. Inkomsten är just det hon vill komma bort från.",
 alt:"Det är därför arbetslöshet kan kännas tung även när pengarna räcker: dagarna saknar struktur och man tappar kollegorna."},
{id:"f1-07",f:1,l:1,t:"Herzberg",r:"F1 · Inre och yttre incitament, Herzberg (slide 10)",type:"mc",chk:true,
 q:"Vad säger Herzberg om människans behov i arbetet?",
 o:["Människan söker först basala behov (trygga kontrakt och tillräcklig lön). När de är uppfyllda blir inre motivation och självförverkligande viktigast", "Människan söker främst utmaningar, autonomi och samhörighet, och yttre belöningar som lön riskerar att urholka den inre motivationen", "Behoven är inte givna av naturen utan rationella värderingar, så det som är viktigast i arbetet skiljer sig mellan olika individer", "Människan justerar sina preferenser efter det som upplevs möjligt, och väljer därför ofta ett jobb som är tillräckligt bra"],a:0,
 why:"Herzberg: yttre incitament måste vara på plats, annars blir motivationen och produktiviteten låg. Först därefter blir de inre faktorerna det som gör människan mest motiverad.",
 alt:"Alternativ två är självbestämmandeteorin (F2), tre är Locke och fyra är Vroom."},
{id:"f1-08",f:1,l:1,t:"Locke, Vroom och Adams",r:"F1 · Värderingar och förväntningar (slide 11)",type:"match",chk:true,
 q:"Vem står för vad?",
 cats:["Locke","Vroom","Adams"],
 items:[{t:"Behov är inte givna av naturen utan rationella värderingar",a:0},
  {t:"Individen justerar sin preferens efter vad som upplevs möjligt",a:1},
  {t:"Värderingar formas av relativa jämförelser",a:2},
  {t:"Individen har en preferens för vad som är viktigast och försöker uppnå det",a:0}],
 why:"Locke: värderingar och preferenser. Vroom: förväntningar, alltså vad som verkar möjligt. Adams: jämförelser med andra.",
 alt:"Adams = ”Får kollegan mer än jag?”. Vroom = ”Det där klarar jag ändå inte, jag tar det näst bästa”."},
{id:"f1-09",f:1,l:1,t:"Organisationslojalitet",r:"F1 · Organisationslojalitet (slide 12)",type:"match",chk:true,
 q:"Para ihop typen av organisationslojalitet med definitionen.",
 cats:["Affektiv","Instrumentell","Normativ"],
 items:[{t:"Känner och vill samma sak som organisationen",a:0},
  {t:"Tjänar på att vara lojal mot organisationen",a:1},
  {t:"Upplever sig skyldig organisationen något",a:2}],
 why:"Organisationslojalitet = organisationens mål sammanfaller med individens. Affektiv = känsla, instrumentell = nytta, normativ = skuld/plikt.",
 alt:"Affektiv: ”jag älskar stället”. Instrumentell: ”det lönar sig”. Normativ: ”jag är skyldig dem”."},
{id:"f1-10",f:1,l:1,t:"Psykisk arbetsmiljö",r:"F1 · Psykisk arbetsmiljö (slide 15)",type:"mc",chk:true,
 q:"Vilket är en faktor i den psykiska arbetsmiljön?",
 o:["Beslutsutrymme","Buller","Vibrationer","Obekväma arbetsställningar"],a:0,
 why:"Psykisk arbetsmiljö: krav i arbetet, beslutsutrymme, rättvisa i organisationen, otrygga arbetsvillkor samt faror, hot, trakasserier och kränkande särbehandling. De andra alternativen är fysisk arbetsmiljö.",
 alt:"Fysisk = det som direkt fysiskt påverkar kroppen. Psykisk = hur arbetet är organiserat och hur man behandlas."},
{id:"f1-11",f:1,l:1,t:"Krav–kontroll-modellen",r:"F1 · Krav–kontroll-modellen (slide 20)",type:"mc",chk:true,
 q:"Vad kallas ett arbete med höga krav och låg egen kontroll i Karaseks modell?",
 o:["Högstressarbete", "Aktivt arbete", "Passivt arbete", "Lågstressarbete"],a:0,
 why:"Höga krav och låg kontroll = högstressarbete, job strain. Det är den kombinationen som kopplas till depressionssymtom.",
 alt:"Höga krav med hög kontroll är jobbigt men utvecklande: aktivt arbete. Det är bristen på kontroll som gör kraven farliga."},
{id:"f1-12",f:1,l:2,t:"Krav–kontroll-modellen",r:"F1 · Krav–kontroll-modellen (slide 20)",type:"cloze",chk:true,
 q:"Fyll i krav–kontroll-modellen.",
 text:"Låga krav och hög kontroll ger {lågstressarbete}. Höga krav och hög kontroll ger {aktivt arbete}. Låga krav och låg kontroll ger {passivt arbete}. Höga krav och låg kontroll ger {högstressarbete}.",
 extra:["utbrändhet","anomie"],
 why:"Stressdiagonalen går från lågstress till högstress. Aktivitetsdiagonalen går från passiva till aktiva arbeten.",
 alt:"Börja med det farligaste hörnet: mycket att göra och inget att säga till om = högstress. Byt sedan ett i taget."},
{id:"f1-13",f:1,l:2,t:"Krav–kontroll-modellen",r:"F1 · Krav–kontroll-modellen (slide 20)",type:"mc",chk:true,
 q:"En bartender har extremt mycket att göra en fredagskväll men bestämmer själv hur stationen läggs upp och i vilken ordning beställningarna tas. Vilken typ av arbete är det enligt Karasek?",
 o:["Aktivt arbete","Högstressarbete","Passivt arbete","Lågstressarbete"],a:0,
 why:"Höga krav plus hög egen kontroll = aktivt arbete. Kraven kan hanteras eftersom bartendern själv styr.",
 alt:"Byt ut detaljen: om chefen styr varje steg samma kväll blir det högstress. Kraven är samma, det är kontrollen som avgör."},
{id:"f1-14",f:1,l:2,t:"Locke, Vroom och Adams",r:"F1 · Värderingar och förväntningar (slide 11)",type:"mc",chk:true,
 q:"Sara vill helst ha ett utmanande jobb men har inte tid att satsa på det just nu. Hon väljer ett jobb med schyssta kollegor, det är tillräckligt bra. Vem förklarar det bäst?",
 o:["Vroom","Adams","Herzberg","Locke"],a:0,
 why:"Vroom: människan justerar sin preferens efter vad som upplevs möjligt. Det är nästan exakt föreläsningens exempel.",
 alt:"Hon har inte ändrat vad hon värderar högst (Locke) och jämför sig inte med någon (Adams). Hon anpassar sig efter vad som är möjligt."},
{id:"f1-15",f:1,l:2,t:"Locke, Vroom och Adams",r:"F1 · Värderingar och förväntningar (slide 11)",type:"mc",chk:true,
 q:"Du var nöjd med lönen tills du fick veta att en kollega med samma pass tjänar 20 kronor mer i timmen. Vem förklarar bäst varför du blir missnöjd?",
 o:["Adams","Vroom","Locke","Herzberg"],a:0,
 why:"Adams: värderingar formas av relativa jämförelser. Lönen är densamma, men jämförelsen gör den sämre.",
 alt:"Ingenting i ditt eget jobb har ändrats. Bara jämförelsen. Jämförelse = Adams."},
{id:"f1-16",f:1,l:2,t:"Organisationslojalitet",r:"F1 · Organisationslojalitet (slide 12)",type:"mc",chk:true,
 q:"Arbetsgivaren betalade Elins sommelierutbildning. Hon vill egentligen byta jobb, men känner att hon står i skuld till restaurangen och stannar. Vilken lojalitet är det?",
 o:["Normativ","Instrumentell","Affektiv"],a:0,
 why:"Normativ lojalitet = man upplever sig skyldig organisationen något.",
 alt:"Hon tjänar inget på att stanna (inte instrumentell) och delar inte stället känslomässigt (inte affektiv). Det som håller kvar henne är skulden."},
{id:"f1-17",f:1,l:2,t:"Organisationslojalitet",r:"F1 · Organisationslojalitet (slide 12)",type:"mc",chk:true,
 q:"Jonas tycker inte särskilt mycket om sin arbetsplats, men han får en stor bonus om han stannar tre år till. Vilken lojalitet är det?",
 o:["Instrumentell","Normativ","Affektiv"],a:0,
 why:"Instrumentell lojalitet = man tjänar på att vara lojal.",
 alt:"Fråga: vad skulle hända om bonusen försvann? Om lojaliteten då försvinner var den instrumentell."},
{id:"f1-18",f:1,l:2,t:"Stress",r:"F1 · Stress (slide 17)",type:"tfw",chk:true,
 q:"Utbrändhet är detsamma som stress, alltså kroppens reaktion för att hantera fara.",a:false,
 then:{q:"Varför är påståendet falskt?",
  o:["Stress är en kroppslig reaktion för att hantera fara (fight-or-flight). Utbrändhet är när en permanent stressnivå övergår i fysisk, emotionell och mental utmattning", "Stress är en fysisk arbetsmiljöskada som syns i muskler och skelett, medan utbrändhet är en psykisk reaktion på för lite stimulans", "Stress uppstår bara i passiva arbeten med låga krav, medan utbrändhet uppstår i aktiva arbeten med höga krav och hög kontroll", "Utbrändhet beror på för låga krav och för lite att göra, medan stress beror på för höga krav under en kort period"],a:0,
  why:"Stress är reaktionen i stunden. Utbrändhet är vad som händer när den aldrig går över."},
 why:"Påståendet är falskt.",
 alt:"Björnen i skogen: stress hjälper dig att springa. Men om björnen står utanför dörren varje dag i flera år blir du utmattad."},
{id:"f1-19",f:1,l:2,t:"Anomie",r:"F1 · slide 6 (talaranteckningar)",type:"mc",chk:true,
 q:"Vad är anomie?",
 o:["Ett tillstånd där man upplever att man inte har en funktion och inte är en del av en gemenskap", "Ett tillstånd där arbetet blir mekaniskt och regelstyrt, så att kreativitet och initiativförmåga går förlorade", "Ett tillstånd där arbetsgivaren tillägnar sig mer av värdet än arbetaren själv får tillbaka i lön", "Ett tillstånd där en permanent stressnivå övergår i fysisk, emotionell och mental utmattning"],a:0,
 why:"Anomie är Durkheims begrepp. Det kan uppstå när det som förväntas av en är för svårt, och kopplas till känslan av utanförskap vid arbetslöshet.",
 alt:"Järnburen är Weber, exploatering är Marx och utbrändhet hör till stress."},
{id:"f1-20",f:1,l:3,t:"Herzberg och Locke",r:"F1 · slide 10–11",type:"mc",chk:true,
 q:"Vad är den centrala skillnaden mellan Herzbergs och Lockes syn på vad människor vill ha ut av arbetet?",
 o:["Herzberg ser behoven som naturliga och lika för alla (basala först, sedan inre). Locke ser dem som rationella värderingar som skiljer sig mellan individer", "Herzberg ser behoven som rationella värderingar som skiljer sig mellan individer. Locke ser dem som naturliga och lika för alla", "Herzberg menar att värderingar formas av jämförelser med kollegor. Locke menar att man justerar sina preferenser efter det som verkar möjligt", "Herzberg betonar bara lön och anställningstrygghet. Locke betonar bara inre motivation, utmaningar och självförverkligande"],a:0,
 why:"Locke: ”behov inte givna av naturen, utan rationella värderingar”. Det är just det som skiljer honom från Herzberg. Samma skiljelinje kom på tentan 24/25: lika eller olika människor.",
 alt:"Fråga: vill alla ha samma sak i samma ordning? Herzberg säger ja, Locke säger att det beror på personen."},
{id:"f1-21",f:1,l:3,t:"Fysisk och psykisk arbetsmiljö",r:"F1 · Fysisk och psykisk arbetsmiljö (slide 14–15)",type:"mc",chk:true,
 q:"Hur kopplar föreläsningen arbetsdelningen till den fysiska respektive den psykiska arbetsmiljön?",
 o:["Fysisk: stark koppling till arbetsdelningen på strukturell (samhälls)nivå, ofta arbetarklassyrken. Psykisk: arbetsdelningen inom organisationen är central", "Fysisk: arbetsdelningen inom organisationen är central. Psykisk: stark koppling till arbetsdelningen på samhällsnivå, ofta tjänstemannayrken", "Fysisk: beror främst på individens egen livsstil. Psykisk: beror främst på stabila personlighetsdrag och hur individen hanterar stress", "Båda följer i första hand arbetsdelningen på samhällsnivå, eftersom yrket ensamt avgör både den fysiska och den psykiska arbetsmiljön"],a:0,
 why:"Fysiska problem (tungt arbete, buller, kemikalier) följer vilka yrken man har i samhällets arbetsdelning, ofta arbetaryrken, och kopplas till muskel- och skelettsjukdomar (ICD-M). Psykiska problem följer hur arbetet delas och styrs inom organisationen och kopplas till psykiska sjukdomar (ICD-F).",
 alt:"Vilket yrke du har avgör om du lyfter tungt. Hur din chef organiserar jobbet avgör ditt beslutsutrymme."},
{id:"f1-22",f:1,l:3,t:"Durkheim och Marx",r:"F1 · Hur arbetsdelningen påverkar varför vi arbetar (slide 6)",type:"text",chk:true,
 q:"Jämför Durkheims och Marx syn på hur arbetsdelningen påverkar arbetsviljan. (max 50 ord)",
 pts:["Durkheim: arbetsdelningen ger större beroende av varandra","Durkheim: starka arbetsnormer och plikt (”dra sitt strå till stacken”) blir ett samhällskitt","Marx: arbetsdelningen urholkar den naturliga inre arbetsviljan","Marx: människan blir ett utbytbart kugghjul, exploaterad och alienerad"],
 alt:"Skriv en mening per tänkare med ett begrepp vardera: beroende/samhällskitt mot alienation/exploatering."}
);

  why:"Höga krav plus låg kontroll = job strain. Höga krav plus hög kontroll = aktivt arbete, som inte är farligt på samma sätt."},

  why:"Jahodas poäng är att arbetet ger mer än pengar: kontakter, ett gemensamt projekt, struktur, status och identitet."},
 why:"Påståendet är sant.",

{id:"f2-01",f:2,l:1,t:"Organisation",r:"F2 · Vad är en organisation? (slide 3)",type:"mc",chk:true,

 o:["En formell social sammanslutning skapad för att samla individer för att utföra olika aktiviteter och samordna dem mot ett syfte/mål", "En informell grupp människor som umgås regelbundet och delar intressen, men saknar gemensamma regler och ett gemensamt mål", "Enbart företag och myndigheter som anställer personal; familj, skola, fackförbund och politiska partier räknas inte", "En statlig myndighet där regelstyrning, saklighet och likabehandling samordnar tjänstemännens arbete"],a:0,
 why:"Nyckelorden: formell, social sammanslutning, samordna, syfte/mål. Därför räknas även familj, skola, fackförbund och politiska partier.",
 alt:"IFK Norrköping och Socialdemokraterna är organisationer trots att de inte säljer något. Därför är företagsalternativet för snävt."},
{id:"f2-02",f:2,l:1,t:"Organisationens dimensioner",r:"F2 · Arbetsorganisationers dimensioner (slide 5)",type:"mc",chk:true,
 q:"Vilka två dimensioner har alla arbetsorganisationer enligt föreläsningen?",
 o:["Arbetsdelning samt styrning och kontroll av arbetet", "Syfte samt medlemmar som delar organisationens mål", "Formell organisation samt informell organisation", "Lönesättning samt anställningstrygghet för personalen"],a:0,
 why:"Organisationer skiljer sig åt genom variationer i och grader av arbetsdelning och styrning/kontroll. De två är organisationens primära dimensioner.",
 alt:"Syfte och medlemmar är beståndsdelar. Dimensionerna är det du jämför organisationer på."},
{id:"f2-03",f:2,l:1,t:"Horisontell och vertikal arbetsdelning",r:"F2 · Arbetsdelning inom organisationer (slide 6–7)",type:"match",chk:true,
 q:"Vilken typ av arbetsdelning beskrivs?",

 items:[{t:"En eller få uppgifter för varje arbetare",a:0},
  {t:"Vissa roller planerar och styr, andra tar emot order uppifrån",a:1},
  {t:"Många olika typer av uppgifter för varje arbetare",a:2},
  {t:"Den som utför uppgiften styr och planerar den själv",a:3}],
 why:"Horisontell = hur uppgifterna delas upp i bredd. Vertikal = hur planering och styrning delas upp i höjd.",
 alt:"Horisontellt = sidled, vilka uppgifter. Vertikalt = uppåt, vem som bestämmer."},
{id:"f2-04",f:2,l:1,t:"Styrning och kontroll",r:"F2 · Styrning och kontroll (slide 8)",type:"mc",chk:true,
 q:"Vad är skillnaden mellan styrning och kontroll?",
 o:["Styrning sker före utförandet och påverkar framtida skeenden. Kontroll sker efter eller under utförandet och följer upp", "Styrning sker uppifrån och ned i hierarkin. Kontroll sker nerifrån, när de anställda följer upp chefernas beslut", "Styrning gäller tjänstemän och sker med morötter. Kontroll gäller arbetare och sker med piskor och övervakning", "Kontroll sker före utförandet och påverkar framtida skeenden. Styrning sker efter eller under utförandet och följer upp"],a:0,
 why:"Båda behövs för samordning. Skillnaden ligger i tid: före (styrning) eller under/efter (kontroll).",
 alt:"Schemat och receptet för en drink är styrning. Chefen som smakar av drinken efteråt är kontroll."},
{id:"f2-05",f:2,l:1,t:"Styrningsformer",r:"F2 · Styrningsformer (slide 9–11)",type:"match",chk:true,

 items:[{t:"Direktstyrning",d:"En förman instruerar",a:0},
  {t:"Standardisering",a:0},
  {t:"Teknologisk styrning",d:"Löpande bandet, appar, algoritmer",a:0},
  {t:"Informella löften om befordringar och löneökningar",d:"”Osynliga kontrakt”",a:1},
  {t:"Regelstyrning",a:1},
  {t:"Kunden övervakar och rapporterar",a:1},
  {t:"Målstyrning",a:2},
  {t:"Normativ styrning",d:"Anställda internaliserar organisationens värderingar",a:2}],
 why:"Direkt: någon eller något styr arbetet i stunden. Indirekt: andra mekanismer (löften, regler, kunder, internmarknad) styr. Mindre kontrollerande: organisk samordning, målstyrning och normativ styrning ger autonomi.",
 alt:"Fråga hur nära själva utförandet styrningen sitter: i handen (direkt), runt omkring (indirekt) eller bara målet (mindre)."},
{id:"f2-06",f:2,l:1,t:"Formell och informell organisation",r:"F2 · Teori och praktik (slide 12)",type:"mc",chk:true,
 q:"Vad är ”korridorsbeslut” ett exempel på?",
 o:["Informell organisation: hur organisationen ser ut i praktiken","Formell organisation: hur organisationen officiellt ser ut","Regelstyrning","Målstyrning"],a:0,
 why:"Den formella organisationen är riktlinjerna. Den informella är den faktiska styrningen och arbetsdelningen, t.ex. beslut som tas i korridoren.",
 alt:"Personalhandboken säger att chefen lägger schemat. I praktiken byter alla pass med varandra i gruppchatten. Det är den informella organisationen."},
{id:"f2-07",f:2,l:1,t:"McGregor",r:"F2 · Ledares teori om mänsklig natur (slide 14)",type:"mc",chk:true,
 q:"Vad kännetecknar en X-ledare enligt McGregor?",
 o:["Tror att människor arbetar av yttre motiv och gärna så lite som möjligt. Fokus på belöningssystem, styrning och kontroll ovanifrån", "Tror att människor vill arbeta av inre anledningar och söker ansvar. Fokus på autonomi, frihet och lösare styrning", "Tror att människor främst drivs av gemenskap. Fokus på sociala relationer, trivsel och sammansvetsade arbetsgrupper", "Tror att gruppen vet bäst. Fokus på självstyrande grupper som samordnar sig själva genom ömsesidig anpassning"],a:0,
 why:"Ledarskapsteori = ledarens teori om mänsklig motivation. X: yttre motiv och kontroll. Y: inre motiv och lösare styrning.",
 alt:"X = ”de gör inget om jag inte vaktar dem”. Y = ”de vill göra ett bra jobb om jag låter dem”."},
{id:"f2-08",f:2,l:1,t:"Självbestämmandeteori",r:"F2 · Självbestämmandeteori (slide 15)",type:"mc",chk:true,
 q:"Vad söker människan främst enligt självbestämmandeteorin (SDT)?",
 o:["Utmaningar (kompetens), fritt utforskande (autonomi) och samhörighet (gemenskap)", "Trygghet (fast anställning) och materiellt välstånd (lön), därefter självförverkligande", "Hög lön, befordran och hög status i förhållande till kollegorna", "Tydlig struktur (fasta ramar), direkt återkoppling och yttre belöningar"],a:0,
 why:"SDT utgår från tre behov: kompetens, autonomi och samhörighet. Trygghet och materiellt välstånd är Herzberg och andra behovsteorier, som SDT vänder sig mot.",
 alt:"Kom ihåg ”KAS”: kompetens, autonomi, samhörighet."},
{id:"f2-09",f:2,l:1,t:"Självbestämmandeteori",r:"F2 · SDT – viktiga begrepp (slide 17)",type:"match",chk:true,
 q:"Para ihop begreppet med definitionen.",
 cats:["Intrinsikal motivation","Extrinsikal motivation","Internalisering","Orientering"],
 items:[{t:"Motivation framkallad av att uppgiften är intressant eller lustfylld i sig",a:0},
  {t:"Motivation framkallad av externa mål man vill uppnå",a:1},
  {t:"Externa incitament börjar upplevas som en del av en själv",a:2},
  {t:"Individuella tendenser att reagera på styrning",d:"Kontrollsökande eller autonomisökande",a:3}],
 why:"Internalisering förklarar hur yttre motivation kan bli mer autonom. Orientering förklarar varför människor reagerar olika på samma styrning.",
 alt:"Internalisering = utifrån blir inifrån. Orientering = vem du är som person inför styrning."},
{id:"f2-10",f:2,l:2,t:"Självbestämmandeteori",r:"F2 · Självbestämmandeteori (slide 15)",type:"mc",chk:true,
 q:"Vad händer enligt SDT när arbetsmiljön är kontrollerande, t.ex. med belöningssystem som styr beteendet?",
 o:["Den inre motivationen urholkas","Den inre motivationen förstärks","Motivationen påverkas inte","Den affektiva lojaliteten ökar"],a:0,
 why:"Enligt SDT (Deci m.fl. 1999) urholkar en kontrollerande miljö den inre motivationen. Miljön måste i stället tillåta och uppmuntra kompetens, autonomi och samhörighet.",
 alt:"Om du får betalt per sålt shot kan det som var kul bli en jakt på provision. Det kallas att belöningen tränger ut den inre motivationen."},
{id:"f2-11",f:2,l:2,t:"Uppgiftens karaktär",r:"F2 · SDT – fördjupad analys (slide 16)",type:"tfw",chk:true,
 q:"Enligt föreläsningen fungerar frihet och autonomi alltid bättre än belöningssystem för att motivera anställda.",a:false,
 then:{q:"Varför är påståendet falskt?",
  o:["Uppgiftens karaktär avgör: för enkla repetitiva uppgifter fungerar belöningssystem bättre, för svårare problem frihet och autonomi", "Belöningssystem fungerar alltid bättre, eftersom yttre incitament ökar den inre motivationen för alla typer av uppgifter", "Det beror enbart på lönenivån: med tillräckligt hög lön spelar varken frihet eller belöningssystem någon roll", "Frihet och autonomi fungerar bara för chefer och experter, medan alla andra anställda behöver detaljerade instruktioner"],a:0,
  why:"Uppgiftens karaktär avgör vilken typ av incitament som fungerar bäst (Cerasoli m.fl. 2014). Dessutom varierar människor i hur de reagerar på styrning."},
 why:"Påståendet är falskt.",
 alt:"Att diska glas snabbare kan belönas per back. Att hitta på en ny cocktailmeny går inte att belöna per minut."},
{id:"f2-12",f:2,l:2,t:"Självbestämmandeteori",r:"F2 · SDT – viktiga begrepp (slide 17)",type:"mc",chk:true,
 q:"Två nyanställda får samma detaljerade instruktioner. Den ena trivs, den andra känner sig kvävd. Vilket SDT-begrepp förklarar skillnaden?",
 o:["Orientering", "Internalisering", "Amotivation", "Introjicerad reglering"],a:0,
 why:"Orientering = individuella tendenser att reagera på styrning. Kontrollsökande vill ha tydlig struktur. Autonomisökande vill själva sätta ramarna.",
 alt:"Samma styrning, olika reaktion. Skillnaden ligger hos personen, och det är just det orientering beskriver."},
{id:"f2-13",f:2,l:2,t:"Organisationstyper och McGregor",r:"F2 · slide 19–28",type:"match",chk:true,
 q:"Bygger organisationsformen på teori X eller teori Y?",
 cats:["Teori X","Teori Y"],
 items:[{t:"Taylorism",a:0},{t:"LEAN",d:"Total styrning",a:0},{t:"Socio-teknisk organisation",a:1},{t:"Lärande organisation",a:1}],
 why:"Taylorismen vill ta bort effekterna av mänsklig lathet (X). LEAN har total styrning (X). Socio-teknisk organisation bygger på att människor blomstrar i autonoma miljöer (Y). Lärande organisationer styr normativt (Y).",
 alt:"Leta efter kontroll och standardisering (X) eller autonomi och gemensamma värderingar (Y)."},
{id:"f2-14",f:2,l:1,t:"Taylorism och Fordism",r:"F2 · Taylorism och Fordism (slide 19–20)",type:"mc",chk:true,
 q:"Vad tillför Fordismen till Taylorismens rationella arbetsledning?",
 o:["Löpande bandet: maskinen styr arbetstakten", "Självstyrande grupper: laget styr arbetstakten", "Regelstyrning: likabehandling och saklighet", "Målstyrning: de anställda får eget ansvar"],a:0,
 why:"Fordism = rationell arbetsledning plus löpande bandet. Produktionen delas upp, fokus ligger på effektivitet, och maskinen styr takten.",
 alt:"Taylor = förmannen styr. Ford = bandet styr."},
{id:"f2-15",f:2,l:1,t:"Byråkrati",r:"F2 · Byråkratiska organisationer (slide 21–22)",type:"mc",chk:true,
 q:"Vad kännetecknar byråkratiska organisationer?",
 o:["Regelstyrning, saklighet, objektivitet, likabehandling, specialister och hierarkier", "Löpande band, standardisering och direkt övervakning av förmän i varje moment", "Lösa arbetsroller, temporära uppgifter och kunskap utspridd i organisationen", "Självstyrande team utan chefer, med coacher som stöd och organisk samordning"],a:0,
 why:"Byråkratin effektiviserar genom rationella i stället för godtyckliga beslut. Den passar t.ex. statliga verk, där korrekthet är viktigt.",
 alt:"Tänk på Försäkringskassan: samma regler för alla, handläggare med specialområden och en tydlig hierarki."},
{id:"f2-16",f:2,l:2,t:"Socio-teknisk organisation",r:"F2 · Socio-teknisk organisation (slide 26)",type:"cloze",chk:true,
 q:"Fyll i luckorna om socio-teknisk organisation.",
 text:"Socio-teknisk organisation bygger på {teori Y}. Arbetsdelningen minskas genom {arbetsutvidgning}, alltså mindre arbetsdelning i horisontell bemärkelse, och {arbetsberikning}, alltså mindre arbetsdelning i vertikal bemärkelse. Styrningen sker genom organisk samordning och {ömsesidig anpassning}, avstandardisering och målstyrning.",
 extra:["teori X","standardisering","direktstyrning"],
 why:"Utvidgning = fler sorters uppgifter (horisontellt). Berikning = mer planering och ansvar (vertikalt). Båda minskar arbetsdelningen.",
 alt:"Bredare jobb = utvidgning. Djupare jobb, mer bestämmande = berikning."},
{id:"f2-17",f:2,l:2,t:"Arbetsutvidgning och arbetsberikning",r:"F2 · Socio-teknisk organisation (slide 26)",type:"match",chk:true,
 q:"Är förändringen arbetsutvidgning eller arbetsberikning?",
 cats:["Arbetsutvidgning","Arbetsberikning"],
 items:[{t:"Bartendern ska nu också ta hand om kassan och bokningarna",a:0},
  {t:"Bartendrarna får själva bestämma drinkmeny och arbetsupplägg",a:1},
  {t:"Analytikerna får även hålla i presentationer för klienter",a:0},
  {t:"Kodarna får själva avgöra hur uppgifterna ska avgränsas och utföras",a:1}],
 why:"Arbetsutvidgning = minskad horisontell arbetsdelning: fler typer av uppgifter. Arbetsberikning = minskad vertikal arbetsdelning: mer planering och styrning av det egna arbetet.",
 alt:"Fråga: får personen fler saker att göra (utvidgning) eller mer att säga till om (berikning)?"},
{id:"f2-18",f:2,l:1,t:"LEAN",r:"F2 · Processorienterade organisationer, LEAN (slide 24)",type:"mc",chk:true,
 q:"Vad kännetecknar LEAN?",
 o:["Mål att eliminera överflödiga resurser; team inom specialiserade funktioner, arbetet uppdelat i små delar och total styrning (”X”-teori)", "Mål att ge gruppen kontroll: självstyrande team utan chefer, arbetsutvidgning, arbetsberikning och avstandardisering (”Y”-teori)", "Mål att garantera rättssäkerhet: regelstyrning, saklighet, likabehandling, specialister och tydliga hierarkier", "Mål att klara kriser: lösa arbetsroller, temporära uppgifter, kunskap utspridd i organisationen och normativ styrning"],a:0,
 why:"LEAN kombinerar direkt styrning, standardisering, målstyrning och eget ansvar, samt styrning genom teknik, visualisering, känslor och skuldbeläggande, och internmarknader.",
 alt:"LEAN låter modernt med team, men är i grunden ”X”: små delar, standard och total styrning."},
{id:"f2-19",f:2,l:2,t:"LEAN",r:"F2 · LEAN (slide 24)",type:"mc",chk:true,
 q:"Kodarna får ett ökat ansvar för att organisationen ska fungera optimalt och effektivt, men samtidigt färre och mer avgränsade uppgifter. Vilken organisationsform är det?",
 o:["LEAN","Socio-teknisk organisation","Lärande organisation","Byråkrati"],a:0,
 why:"Eget ansvar för helheten plus uppdelning i små beståndsdelar är LEAN. Socio-teknisk organisation skulle ge fler och bredare uppgifter, inte färre.",
 alt:"Det här är en del av lucktexten om Vera på tentan 24/25. Färre och mer avgränsade uppgifter = mer arbetsdelning = inte socioteknik."},
{id:"f2-20",f:2,l:2,t:"New Public Management",r:"F2 · New public management (slide 25)",type:"mc",chk:true,
 q:"Vad händer med professionens mål under New Public Management?",
 o:["De minskar i betydelse, medan organisationens mål (t.ex. rättvis vård till låg kostnad) ökar", "De ökar i betydelse, medan organisationens mål (t.ex. låg kostnad) minskar när professionerna får mer makt", "De ersätts helt av kundens mål, eftersom vårdtagare och elever själva får styra verksamheten", "De påverkas inte, eftersom NPM bara förändrar hur budgeten fördelas mellan offentliga verksamheter"],a:0,
 why:"NPM: eliminera överflödiga resurser i offentlig vård, skola och omsorg. Fokus på mätbarhet för varje moment, privatiseringar och minskad byråkrati, som i praktiken förs över till professionerna och kontrollmyndigheterna.",
 alt:"Läkaren vill ge all vård som behövs här och nu (professionen). Regionen vill fördela vården rättvist till låg kostnad (organisationen). Under NPM vinner regionen."},
{id:"f2-21",f:2,l:2,t:"Buurtzorg",r:"F2 · Exempel socio-teknisk: Buurtzorg (slide 27)",type:"mc",chk:true,
 q:"Ett hemvårdsföretag har självstyrande vårdteam som själva sköter kontakt med vårdtagare, inköp och resursfördelning, utan chefer, med coacher som stöd. Vilken organisationsform är det exempel på?",
 o:["Socio-teknisk organisation","LEAN","New Public Management","Byråkrati"],a:0,
 why:"Det är Buurtzorg-modellen, föreläsningens exempel på socio-teknisk organisation: autonoma team, organisk samverkan och minimalt med administrativa roller.",
