{id:"f3-21",f:3,l:3,t:"Goldthorpe och Wright",r:"F3 · Wright och Goldthorpe – viktiga skillnader (slide 30)",type:"tfw",chk:true,
 q:"Enligt Wright är experters kunskap främst organisationsspecifik, alltså bara värdefull i den egna organisationen.",a:false,
 then:{q:"Varför är påståendet falskt?",
  o:["Det är Goldthorpes syn. Enligt Wright är expertkunskapen generell och eftertraktad av många arbetsgivare, vilket stärker förhandlingspositionen", "Wright menar att experter saknar förhandlingsposition, eftersom deras arbete är lätt att övervaka och standardisera", "Wright skiljer inte på experter och andra anställda, utan delar bara in efter ägande av produktionsmedel", "Wright menar att kunskapen saknar värde utan utbildningscertifikat, och att certifikaten öppnar alla yrken för alla"],a:0,
  why:"Goldthorpe: organisationsspecifik kunskap. Wright: generell kunskap. En av de tre stora skillnaderna mellan dem."},
 why:"Påståendet är falskt.",
 alt:"Organisationsspecifik = Goldthorpe. Generell och eftertraktad = Wright."},
{id:"f4-01",f:4,l:1,t:"Kunskapssamhället",r:"F4 · Kunskapssamhällets kännetecken (slide 2)",type:"mc",chk:true,
 q:"Vad menade Daniel Bell med ”meritokrati”?",
 o:["Ansvar och position efter förmåga i stället för efter tradition och kapital", "Att kapitalägarna styr samhället, eftersom fysiskt kapital blir den viktigaste resursen", "Att alla får samma lön och samma ansvar oavsett utbildning och skicklighet", "Att klassbakgrund och familjens kontakter blir viktigare än kunskap för karriären"],a:0,
 why:"Bell förutspådde på 1970-talet att kunskap och skicklighet blir framtidens viktigaste resurser, viktigare än fysiskt kapital. Den skickliga får mest ansvar, och klassbakgrunden minskar i betydelse. Ojämlikheten blir meritokratisk: mellan dem som har och inte har tillräckliga kunskaper.",
 alt:"Merit = förtjänst. Meritokrati = de som förtjänar det genom sin förmåga styr, inte de som ärvt."},
{id:"f4-02",f:4,l:1,t:"Tjänstesamhället",r:"F4 · Tjänstesamhällets framväxt (slide 4)",type:"match",chk:true,
 q:"Vilken sektor hör verksamheten till?",
 cats:["Primär","Sekundär","Tertiär"],
 items:[{t:"Jordbruk",a:0},{t:"Skogsbruk och råvaror",a:0},{t:"Bilfabrik",a:1},{t:"Bankväsendet",a:2},{t:"Den lokala pizzerian",a:2}],
 why:"Primär = jordbruk och råvaror. Sekundär = industri och produktion. Tertiär = service och tjänster, från hela bankväsendet till den lokala pizzerian.",
 alt:"Ta fram råvaran (primär) → förädla den (sekundär) → sälj en tjänst (tertiär)."},
{id:"f4-03",f:4,l:1,t:"Typer av tjänster",r:"F4 · Olika typer av tjänster (slide 7)",type:"match",chk:true,
 q:"Vilken typ av tjänst är det?",
 cats:["Människoorienterade","Företagsorienterade","Personliga"],
 items:[{t:"Lärare",a:0},{t:"Sjuksköterska",a:0},{t:"Logistik",a:1},{t:"IT-konsultbolag",a:1},{t:"Försäljning",a:2},{t:"Reparationer",a:2}],
 why:"Människoorienterade tjänster (human services): t.ex. lärare, HR och sjuksköterskor. Företagsorienterade (market services): logistik, finansiella tjänster och IT-konsulter. Personliga (personal services): försäljning och reparationer.",
 alt:"Vem är mottagaren? Människans kapacitet (vård, utbildning), ett annat företag, eller du som kund i butiken?"},
{id:"f4-04",f:4,l:1,t:"Teknologiskt paradigmskifte",r:"F4 · IT och teknologiska paradigmskiften (slide 10)",type:"mc",chk:true,
 q:"Vad är ett teknologiskt paradigmskifte?",
 o:["En gradvis process där en ny uppsättning tekniker och metoder ersätter en äldre", "En plötslig uppfinning som direkt och samtidigt förändrar alla jobb i hela ekonomin", "Att staten inför en ny uppsättning tekniker i alla branscher genom lagstiftning", "Att arbetare och fack under en period vägrar använda ny teknik på arbetsplatsen"],a:0,
 why:"Exempel: ångkraft, elektricitet och nu IT. Den nya tekniken slår den gamla i pris (effektivitet), efterfrågan eller kvalitet, men övergången sker gradvis.",
 alt:"Paradigm = det rådande sättet att göra saker. Skiftet är när ett nytt sätt sakta tar över."},
{id:"f4-05",f:4,l:1,t:"Industriellt och IT-paradigm",r:"F4 · Produktionsproblemet och lösningar (slide 13–16)",type:"match",chk:true,
 q:"Hör det till det industriella paradigmet eller IT-paradigmet?",
 cats:["Industriellt","IT"],
 items:[{t:"Centralt problem: hur uppnå standardisering i så stor skala som möjligt",a:0},
  {t:"Centralt problem: anpassning till en föränderlig produktmarknad och tekniska lösningar",a:1},
  {t:"Taylorism/Fordism med löpande band",a:0},
  {t:"Lärande och flexibla organisationer",a:1},
  {t:"Tydliga direkta belöningssystem, t.ex. ackord",a:0},
  {t:"Livslångt lärande för att hålla sig uppdaterad om ny teknik",a:1}],
 why:"Industriellt: standardiserade organisationer var mest effektiva, så problemet var standardisering i stor skala. IT: ständig förnyelse genom digital teknik, så problemet är anpassning.",
 alt:"Industriellt = göra samma sak billigare och fler gånger. IT = hänga med när allt ändras."},
{id:"f4-06",f:4,l:1,t:"Otrygga arbetsrelationer",r:"F4 · Otrygga arbetsrelationer (slide 20)",type:"multi",chk:true,
 q:"Vilka räknas som tidsbegränsade anställningar (visstid)? Välj fyra.",
 o:["Vikariat","Provanställning","Timanställning","Projektanställning","Tillsvidareanställning på heltid","Anställd i bemanningsföretag"],a:[0,1,2,3],
 why:"Visstidsanställningar: vikariat, provanställning, timanställning och projektanställning. Bemanningsanställda och egenanställda i gig-plattformar räknas som egna kategorier av otrygga arbetsrelationer.",
 alt:"Det är ditt eget fall: en timanställning i baren är en tidsbegränsad anställning."},
{id:"f4-07",f:4,l:1,t:"Oeschs arbetslogiker",r:"F4 · Styrning och lojalitet i Oeschs teori (slide 32)",type:"match",chk:true,
 q:"Mot vad är de övre klasserna lojala i varje arbetslogik?",
 cats:["Teknisk","Organisatorisk","Mellanmänsklig"],
 items:[{t:"Kunskapen (kunskapsgruppen)",a:0},{t:"Organisationen",a:1},{t:"Klienten / klientgruppen",a:2}],
 why:"Oesch: lojaliteten och orienteringen hos de övre klasserna skiljer sig mellan arbetslogikerna. Ingenjören är lojal mot sin kunskap, chefen mot organisationen och läraren mot sina elever.",
 alt:"Fråga vad yrket ”brinner för”: tekniken, företaget eller människan framför sig."},
{id:"f4-08",f:4,l:1,t:"Oeschs arbetslogiker",r:"F4 · Styrning och lojalitet i Oeschs teori (slide 32)",type:"match",chk:true,
 q:"Vad styr de lägre klasserna i varje arbetslogik?",
 cats:["Teknisk","Organisatorisk","Mellanmänsklig"],
 items:[{t:"Produktionsprocessen (maskinen, löpande bandet)",a:0},{t:"Hierarkin (uppifrån och ner)",a:1},{t:"Kunden / klienten",a:2}],
 why:"Montören styrs av bandet, kontoristen av chefen och butiksbiträdet av kunden.",
 alt:"Bartendern styrs mest av gästerna vid baren, inte av en maskin eller av ett papper från chefen. Det är mellanmänsklig logik."},
{id:"f4-09",f:4,l:2,t:"Tjänstesamhället",r:"F4 · Varför blir det fler tjänster? (slide 6)",type:"match",chk:true,
 q:"Vilken förklaring till att tjänsterna ökar illustreras?",
 cats:["Avtagande marginalnytta av produkter","Tjänster konsumeras på nytt","Köp av tid","Utbudseffekt"],
 items:[{t:"Familjen har redan bil, tv och hus och vill inte ha fler",a:0},
  {t:"Du går till frisören igen fem veckor senare",a:1},
  {t:"Två föräldrar som jobbar heltid köper städhjälp och barnpassning",a:2},
  {t:"Manuella industrijobb försvinner, och servicesektorn behövs för att människor ska kunna arbeta",a:3}],
 why:"Efterfrågesidan: avtagande marginalnytta av varor, att tjänster försvinner och kan köpas igen, och köp av tid. Utbudssidan: tjänstesektorn är nödvändig när industrijobben försvinner.",
 alt:"Tre förklaringar handlar om vad vi vill köpa (efterfrågan). En handlar om vilka jobb som finns (utbud)."},
{id:"f4-10",f:4,l:2,t:"Teknologiskt paradigmskifte",r:"F4 · Teknologiska paradigmskiften (slide 11)",type:"tfw",chk:true,
 q:"Teknologiska paradigmskiften sker gradvis, även när den nya tekniken slår den gamla i pris eller kvalitet.",a:true,
 then:{q:"Varför är påståendet sant?",
  o:["Det är svårt att förutsäga vilken teknik som vinner, och det pågår kamp inom och mellan organisationer och mellan klasser om kostnader och vinster","Ny teknik måste först godkännas genom lagstiftning, vilket tar flera decennier","Ny teknik är alltid dyrare än den gamla under de första decennierna","Arbetare har rätt enligt kollektivavtal att vägra använda ny teknik"],a:0,
  why:"Förespråkare mot icke-förespråkare inom organisationer, nya mot gamla företag, och klasskamp när tekniken ersätter uppgifter och yrken. Allt detta bromsar."},
 why:"Påståendet är sant.",
 alt:"Tänk på kassapersonal och självscanning: tekniken fanns länge innan den slog igenom."},
{id:"f4-11",f:4,l:2,t:"Tröskeleffekter",r:"F4 · Tröskeleffekter för företag och vissa yrken (slide 12)",type:"mc",chk:true,
 q:"Vad är ett exempel på en sektoriell (dramatisk) tröskeleffekt av ett paradigmskifte?",
 o:["Att Kodak och Nokia gick under eller krympte kraftigt och att telefonistyrket försvann", "Att löpande bandet infördes gradvis i industrin under hela 1900-talet", "Att fler läser vidare på högskolan för att hänga med i kunskapssamhället", "Att andelen tidsbegränsade anställningar ökade kraftigt under 1990-talet"],a:0,
 why:"Paradigmskiftet går gradvis för samhället som helhet, men för enskilda företag, fabriker och yrken kan det bli dramatiskt: de försvinner.",
 alt:"Tröskel = en punkt där något plötsligt tar slut. För Kodak kom den när digitalkameran slog igenom."},
{id:"f4-12",f:4,l:2,t:"Oeschs klasschema",r:"F4 · Oesch klasschema (slide 33)",type:"match",chk:true,
 q:"Vilken arbetslogik hör yrket till i Oeschs klasschema?",
 cats:["Teknisk","Organisatorisk","Mellanmänsklig"],
 items:[{t:"IT-specialist",a:0},{t:"Snickare",a:0},{t:"Finanschef",a:1},{t:"Callcenteranställd",a:1},{t:"Journalist",a:2},{t:"Kock",a:2},{t:"Hemtjänstpersonal",a:2}],
 why:"Teknisk: arbete med teknik och material. Organisatorisk: administration och kontor. Mellanmänsklig: arbete med människor, från universitetslärare till butiksbiträde. Kockar står under kvalificerat servicearbete i den mellanmänskliga kolumnen.",
 alt:"Callcenter känns som människokontakt, men Oesch placerar det som rutinmässigt kontorsarbete (organisatorisk)."},
{id:"f4-13",f:4,l:2,t:"Oeschs klasschema",r:"F4 · Oesch klasschema (slide 33)",type:"match",chk:true,
 q:"Vilken kvalifikationsnivå i den mellanmänskliga logiken?",
 cats:["Professionella","Semiprofessioner","Kvalificerat servicearbete","Rutinmässigt servicearbete"],
 items:[{t:"Universitetslärare",a:0},{t:"Socialarbetare",a:1},{t:"Barnskötare",a:2},{t:"Butiksbiträde",a:3}],
 why:"Mellanmänsklig kolumn uppifrån: sociokulturella professioner, sociokulturella semiprofessioner, kvalificerat servicearbete och rutinmässigt servicearbete.",
 alt:"Vertikalt avgör utbildningen. Horisontellt avgör vad du arbetar med."},
{id:"f4-14",f:4,l:2,t:"IT-paradigmet",r:"F4 · Lösningar under IT-paradigmet (slide 16)",type:"multi",chk:true,
 q:"Vilka är lösningar under IT-paradigmet? Välj fyra.",
 o:["Lärande organisationer","Funktionell och numerär flexibilitet","Extern rekrytering för att hämta in ny kunskap","Livslångt lärande","Löpande bandet","Ackordslön"],a:[0,1,2,3],
 why:"I IT-paradigmet är anpassning det centrala. Löpande band och ackord är det industriella paradigmets lösningar.",
 alt:"Sortera efter ”standardisera” (industriellt) eller ”anpassa” (IT)."},
{id:"f4-15",f:4,l:2,t:"Karriär under IT-paradigmet",r:"F4 · Karriär under IT-paradigmet (slide 26)",type:"mc",chk:true,
 q:"Hur förändras karriären under IT-paradigmet?",
 o:["Från interna till externa arbetsmarknader: gränslösa karriärer (portföljkarriärer) där man gör karriär genom jobbyten", "Från externa till interna arbetsmarknader: man stannar hos samma arbetsgivare och gör karriär genom befordringar", "Från bred lärandeförmåga till specialisering: man gör karriär genom att bli expert på en enda teknik", "Karriären blir oberoende av utbildning: livslångt lärande ersätts av erfarenhet hos en och samma arbetsgivare"],a:0,
 why:"Från specialisering till bred lärandeförmåga, från interna till externa arbetsmarknader, och livslångt lärande (vidareutbildning, högskola, hålla sig uppdaterad). Gillberg beskriver gränslösa karriärer.",
 alt:"Jämför med Goldthorpes tjänstemän i F3 som stannar för befordran (intern marknad). I IT-paradigmet byter man i stället jobb för att klättra."},
{id:"f4-16",f:4,l:3,t:"Arbetslivets förändring",r:"F4 · Fysisk arbetsmiljö och detaljstyrning (slide 22)",type:"mc",chk:true,
 q:"Vad visar Syk (2022, LNU-data) om arbetslivets förändring sedan 1970-talet?",
 o:["Arbetet blir mindre detaljstyrt och den fysiska arbetsmiljön förbättras (för män), vilket kan kopplas till kunskapssamhällets framväxt", "Arbetet blir mer detaljstyrt och den fysiska arbetsmiljön försämras, vilket kan kopplas till att löpande bandet sprids till tjänstesektorn", "Detaljstyrningen ökar för tjänstemän men minskar för arbetare, medan den fysiska arbetsmiljön är oförändrad sedan 1970-talet", "Ingen tydlig förändring: utbildningskraven, detaljstyrningen och den fysiska arbetsmiljön ligger på samma nivå som på 1970-talet"],a:0,
 why:"Utbildningskraven ökar, färre har stämpelklocka och det blir mindre tungt fysiskt arbete. Det kan kopplas till att kunskapsjobben blir fler.",
 alt:"Fråga: blir det fler eller färre kunskapsjobb? Fler kunskapsjobb ger mindre detaljstyrning och lättare fysiskt arbete."},
{id:"f4-17",f:4,l:3,t:"Tidsbegränsade anställningar",r:"F4 · Utveckling av tidsbegränsade anställningar (slide 23)",type:"mc",chk:true,
 q:"Hur har andelen tidsbegränsade anställningar utvecklats 1968–2022 enligt LNU?",
 o:["De har funnits länge, ökade kraftigt (kanske tillfälligt) under 1990-talet och ligger i dag på ungefär samma nivå som 1991", "De fanns knappt före 1990-talet, men har sedan dess ökat stadigt varje år och är i dag dubbelt så vanliga som 1991", "De har ökat jämnt sedan 1968 i takt med att tjänstesektorn har vuxit och industrijobben har försvunnit", "De var vanligast under 1970-talet och har sedan dess nästan försvunnit tack vare starkare anställningsskydd"],a:0,
 why:"Bilden av en ständigt ökande otrygghet stämmer inte riktigt: visstid är inget nytt, och ökningen kom främst under 1990-talet.",
 alt:"Tre nyckelord: ”funnits länge”, ”1990-talet”, ”i nivå med 1991”."},
{id:"f4-18",f:4,l:3,t:"Karasek och anställningsform",r:"F4 · Karaseks jobbtyper efter kön och anställningsform (slide 25)",type:"tfw",chk:true,
 q:"Enligt föreläsningen är tidsbegränsade jobb typiskt högstressjobb (höga krav, låg kontroll).",a:false,
 then:{q:"Varför är påståendet falskt?",
  o:["Det finns ingen direkt koppling mellan tidsbegränsade och stressiga jobb. Tidsbegränsade jobb är snarare passiva. Ökningen av höga krav och låg kontroll kopplas i stället till framväxten av människoinriktade tjänster", "Tidsbegränsade jobb är snarare aktiva jobb med höga krav och hög kontroll, eftersom de anställda själva väljer sina uppdrag", "Karaseks modell gäller inte tidsbegränsade anställningar, eftersom den bara mäter krav och kontroll hos tillsvidareanställda", "Högstressjobben har minskat kraftigt för alla grupper sedan 1990-talet, så kopplingen till anställningsform har försvunnit"],a:0,
  why:"Kapitel 2.2 i Välfärd och livsvillkor: tidsbegränsade jobb är snarare passiva (låga krav, låg kontroll). Fler jobb med höga krav och låg kontroll hänger troligen ihop med tillväxten av människoinriktade tjänster."},
 why:"Påståendet är falskt.",
 alt:"Ett vikariat som diskare har låga krav och lite att säga till om: passivt. Stressen finns snarare i vård och omsorg."},
{id:"f4-19",f:4,l:3,t:"Klassteori och Oesch",r:"F4 · Är klassteori i behov av uppdatering? (slide 28–30)",type:"mc",chk:true,
 q:"Varför behöver klassteorin uppdateras enligt föreläsningen?",
 o:["Den byggdes på 1970-talet kring lojalitet mot stora industriföretag, men kunskap och klienternas välmående har blivit viktigare drivkrafter och tjänstemännen fler", "Arbetarklassen har vuxit kraftigt sedan 1970-talet, så klasschemana har för få kategorier för industriarbete och manuella yrken", "Klass har slutat påverka människors livschanser, så klassteorin behöver ersättas med teorier om individuella val och preferenser", "Goldthorpe och Wright har visat sig ha fel om exploatering, så den vertikala dimensionen måste tas bort helt ur klassanalysen"],a:0,
 why:"Det ”nya” medelklassproblemet: hur förstår man skillnaderna inom den växande gruppen tjänstemän? Oesch löser det med en horisontell dimension, arbetslogik, utöver den vertikala.",
 alt:"Goldthorpe förklarar lojalitet med indirekt kontroll i organisationen. En lärare drivs snarare av eleverna. Det fångar inte de gamla teorierna."},
{id:"f4-20",f:4,l:3,t:"Oesch",r:"F4 · Oesch uppdaterade klassteori (slide 30–31)",type:"multi",chk:true,
 q:"Vad är syftet med Oeschs uppdaterade klassteori? Välj tre.",
 o:["Förstå skillnader i värderingar som formas av att arbeta med människor kontra siffror eller fysiska material","Förstå nya politiska skiljelinjer, t.ex. mellan den radikala högern och det gamla etablissemanget","Förstå mönster av dominans och styrning inom olika sektorer","Ersätta den vertikala indelningen helt","Bevisa att klass inte längre spelar roll"],a:[0,1,2],
 why:"Oesch behåller den vertikala dimensionen (arbetskontrakt och utbildningsnivå) och lägger till en horisontell: arbetslogik.",
 alt:"Oesch lägger till en dimension, han tar inte bort någon."},
{id:"f4-21",f:4,l:3,t:"Taylorism/Fordism och styrning",r:"F4 · Lösningar under industriella paradigmet (slide 14)",type:"match",chk:true,
 q:"Hur styrs de olika yrkesrollerna under Taylorism/Fordism?",
 cats:["Direkt styrning, standardisering, teknologisk styrning","Indirekt styrning"],
 items:[{t:"Arbetare vid löpande bandet",a:0},{t:"Specialister på processen och organisationen (tjänstemän)",a:1}],
 why:"Samma logik som Goldthorpe i F3: arbetarnas arbete kan övervakas och styras direkt, specialisternas kan det inte.",
 alt:"Koppla ihop F2 (styrningsformer), F3 (Goldthorpe) och F4 (paradigm). Tentan gillar sådana kopplingar."},
{id:"f4-22",f:4,l:3,t:"Oesch",r:"F4 · slide 30–33",type:"text",chk:true,
 q:"Förklara varför Oesch inför en horisontell dimension i klassanalysen och beskriv de tre arbetslogikerna. (max 100 ord)",
 pts:["Klassteorin är från 1970-talet och byggd för industriföretag; tjänste- och servicesektorn har vuxit (det nya medelklassproblemet)","Horisontell dimension = arbetslogik, utöver den vertikala (arbetskontrakt/utbildningsnivå)","Teknisk: lojalitet mot kunskapen, styrning via produktionsprocessen/maskinen","Organisatorisk: lojalitet mot organisationen, styrning via hierarkin","Mellanmänsklig: lojalitet mot klienten, styrning via kunden/klienten"],
 alt:"Bygg svaret som: problem (varför) → lösning (horisontell dimension) → de tre logikerna med lojalitet och styrning."},
{id:"f4-23",f:4,l:2,t:"Oeschs arbetslogiker",r:"F4 · Styrning och lojalitet i Oeschs teori (slide 32)",type:"tfw",chk:true,
 q:"I Oeschs teori styrs butiksbiträden främst av kunden.",a:true,
 then:{q:"Varför är påståendet sant?",
  o:["Butiksbiträdet arbetar i den mellanmänskliga logiken, där de lägre klasserna styrs av kunden eller klienten", "Butiksbiträdet arbetar i den tekniska logiken, där de lägre klasserna styrs av produktionsprocessen och maskinerna", "Butiksbiträdet arbetar i den organisatoriska logiken, där de lägre klasserna styrs av hierarkin uppifrån och ner", "Butiksbiträdet räknas som egen företagare i Oeschs schema och styrs därför inte av någon annan"],a:0,
  why:"Montören styrs av bandet, kontoristen av chefen och butiksbiträdet av kunden."},
 why:"Påståendet är sant.",
 alt:"Mellanmänsklig logik: arbetet sker med och för människor, så det är kunden som styr."},
{id:"f4-24",f:4,l:1,t:"Tjänstesamhället",r:"F4 · Tjänstesamhällets framväxt (slide 4)",type:"tfw",chk:true,
 q:"Den lokala pizzerian hör till den sekundära sektorn, eftersom maten tillverkas där.",a:false,
 then:{q:"Varför är påståendet falskt?",
  o:["Pizzerian är en tjänst och hör till den tertiära sektorn. Den sekundära sektorn är industri och produktion, t.ex. en bilfabrik", "Pizzerian hör till den primära sektorn, eftersom den bygger på råvaror som mjöl, tomater och ost", "Pizzerian hör inte till någon sektor, eftersom små företag inte räknas i sektorindelningen", "Pizzerian hör till den sekundära sektorn bara om den levererar färdiga pizzor till andra företag"],a:0,

const LS="akpa-soc-v1";

let dbRef=null, syncNote="Sparas i den här webbläsaren";

function loadLocal(){try{const s=JSON.parse(localStorage.getItem(LS)||"null");if(s&&s.qs)state=s;}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
let chain=Promise.resolve(),dirty=false;
function persist(){
  state.updated=Date.now(); saveLocal();
  if(!dbRef) return; dirty=true;
  chain=chain.then(async()=>{ if(!dirty)return; dirty=false;
    try{await dbRef.set(JSON.parse(JSON.stringify(state)));syncNote="Sparat och synkat";}
    catch(e){syncNote="Kunde inte synka, sparat lokalt";}
  });
}
async function initDb(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbRef=db.doc("data/users/"+id+"/progress");
    const snap=await dbRef.get();
    if(snap.exists){const d=snap.data(); if(d&&d.qs&&(d.updated||0)>=(state.updated||0)){state=JSON.parse(JSON.stringify(d));saveLocal();}}
    else if(state.updated) persist();
    syncNote="Sparat och synkat";
    if(screen==="home") render();
  }catch(e){dbRef=null;}
}

(function buildPersQ(){
  const nb=p=>PERS.filter(o=>o!==p&&!(p.ex||[]).includes(o.id)&&!(o.ex||[]).includes(p.id));
  const near=(p,arr)=>arr.slice().sort((a,b)=>Math.abs(a.f-p.f)-Math.abs(b.f-p.f)||Math.random()-.5).slice(0,3);
  const opts=(right,wrong)=>{const o=shuffle([right].concat(wrong));return {o,a:o.indexOf(right)};};
  PERS.forEach(p=>{
    const d=near(p,nb(p)), r="Personer · "+p.b;
    const a=opts(p.n,d.map(x=>x.n));
    Q.push({id:"p-"+p.id+"-1",f:null,s:"pers",l:1,t:p.n,r,type:"mc",chk:true,
      q:"Vem förknippas med: "+p.k.charAt(0).toLowerCase()+p.k.slice(1)+"?",o:a.o,a:a.a,why:p.why,
      alt:p.n+" (F"+p.f+"): "+p.k+"."});
    const d2=near(p,nb(p)), b=opts(p.k,d2.map(x=>x.k));
    Q.push({id:"p-"+p.id+"-2",f:null,s:"pers",l:2,t:p.n,r,type:"mc",chk:true,
      q:"Vad förknippas "+p.n+" med?",o:b.o,a:b.a,why:p.why,
      alt:"Tänk på vilken föreläsning "+p.n+" kom upp i: F"+p.f+" ("+(LECT.find(x=>x.n===p.f)||{}).title+")."});
  });
  LECT.forEach(L0=>{
    const ps=PERS.filter(p=>p.f===L0.n&&p.id!=="pink");
    for(let i=0;i<ps.length;i+=4){
      let g=ps.slice(i,i+4); if(g.length<3&&ps.length>=3) g=ps.slice(-3);
      if(g.length<2) continue;
      Q.push({id:"p-match-f"+L0.n+"-"+(i/4+1),f:null,s:"pers",l:3,t:"Personer F"+L0.n,r:"Personer · F"+L0.n,type:"match",chk:true,
        q:"Para ihop personen med idén (F"+L0.n+" · "+L0.title+").",cats:g.map(p=>p.n),
        items:g.map((p,j)=>({t:p.k,a:j})),
        why:g.map(p=>p.why).join(" "),
        alt:g.map(p=>p.n+": "+p.k).join(" · ")});
    }
  });
})();

/* ---------- poäng och dagens pass ---------- */
function qPts(q){return q.type==="tfw"?3:q.type==="multi"?2:q.type==="match"?q.items.length:q.type==="cloze"?clozeAns(q).length:q.type==="text"?3:1;}
function rightText(q){
  if(q.type==="mc") return q.o[q.a];
  if(q.type==="multi") return q.a.map(i=>q.o[i]).join(" · ");
  if(q.type==="tf") return q.a?"Sant":"Falskt";
  if(q.type==="tfw") return (q.a?"Sant":"Falskt")+". "+q.then.o[q.then.a];
  if(q.type==="match") return q.items.map(it=>it.t+" → "+q.cats[it.a]).join(" · ");
  if(q.type==="cloze") return clozeAns(q).join(" · ");
  return q.pts.join(" · ");
}
const studyPool=()=>Q.filter(q=>q.f||q.s==="t24");
function todayDone(){return state.dn&&state.dn.d===today()?state.dn.n:0;}
function dailyGoal(){
  const left=studyPool().filter(q=>st(q.id).box===0).length, dl=daysLeft();
  if(dl<0) return 10;
  const g=Math.ceil(left*1.5/Math.max(1,dl-1));
  return Math.min(60,Math.max(10,Math.ceil(g/5)*5));
}
function pickToday(){
  const pool=studyPool().filter(q=>q.type!=="text"), pick=[];
  const add=(arr,n)=>{arr.filter(q=>!pick.includes(q)).slice(0,n).forEach(q=>pick.push(q));};
  add(shuffle(pool.filter(q=>{const s=state.qs[q.id];return s&&s.w>0&&s.box===0;})),3);
  add(pool.filter(q=>!st(q.id).seen).sort((a,b)=>a.l-b.l||(a.f||9)-(b.f||9)||Math.random()-.5),5);
  add(pool.filter(q=>{const s=st(q.id);return s.seen&&s.box>0&&s.box<3;}).sort((a,b)=>st(a.id).last-st(b.id).last),2);
  add(pool.slice().sort((a,b)=>prio(a)-prio(b)),10-pick.length);
  return pick.sort((a,b)=>a.l-b.l);
}
let EX=null, exTimer=null;
function pickExam(){
  const pool=Q.filter(q=>q.l>=2&&q.s!=="aberg"&&q.type!=="text"), pick=[];
  const take=(arr,n)=>{shuffle(arr).filter(q=>!pick.includes(q)).slice(0,n).forEach(q=>pick.push(q));};
  take(pool.filter(q=>q.type==="tfw"),3); take(pool.filter(q=>q.type==="match"),4);
  take(pool.filter(q=>q.type==="multi"),2); take(pool.filter(q=>q.type==="cloze"),1);
  let pts=pick.reduce((a,q)=>a+qPts(q),0)+6;
  for(const q of shuffle(pool.filter(q=>q.type==="mc"))){if(pts>=70)break;if(!pick.includes(q)){pick.push(q);pts++;}}
  const tx=shuffle(Q.filter(q=>q.type==="text")).slice(0,2);
  return shuffle(pick).concat(tx);
}
const mmss=ms=>{const t=Math.floor(ms/1000);return Math.floor(t/60)+":"+String(t%60).padStart(2,"0");};
function examPoint(p){
  const q=cur.q; EX.got+=p; EX.log.push({q,p,max:qPts(q)}); next();
}

/* ---------- lesson ---------- */
let queue=[],pos=0,total=0,correct=0,results=[],cur=null,sel=null,answered=false;
const prio=q=>{const s=st(q.id);return (s.seen?1:0)*10+s.box*2+(s.last?(s.last/1e13):0)+Math.random()*0.5;};
const textLast=a=>a.sort((x,y)=>(x.type==="text")-(y.type==="text"));
function reviewFrom(k){
  const older=Q.filter(q=>trackOf(q)!==k&&q.type!=="text"&&st(q.id).seen&&st(q.id).box===0);
  return older.length?[{...pickOne(older),_review:true}]:[];
}
function pickFor(k){
  const qs=byTrack(k), t=TR[k];
  if(t.lect){
    const lv=[1,2,3].filter(l=>qs.some(q=>q.l===l));
    const curL=lv.find(l=>masteryOf(qs.filter(q=>q.l===l))<70)||lv[lv.length-1]||1;
    const score=q=>prio(q)+(q.l>curL?(q.l-curL)*6:0)+(q.l<curL?3:0);
    let pick=qs.filter(q=>q.type!=="text").sort((a,b)=>score(a)-score(b)).slice(0,7);
    if(curL===3){const tx=qs.filter(q=>q.type==="text").sort((a,b)=>prio(a)-prio(b))[0];if(tx)pick.push(tx);}
    pick=pick.concat(reviewFrom(k));
    return textLast(pick.sort((a,b)=>a.l-b.l));
  }
  const tx=k==="final"?qs.filter(q=>q.type==="text").sort((a,b)=>prio(a)-prio(b)).slice(0,1):[];
  const nt=qs.filter(q=>q.type!=="text").sort((a,b)=>prio(a)-prio(b)).slice(0,t.size-tx.length);
  return textLast(shuffle(nt.concat(tx)));
}
function pickWeak(){
  const w=Q.filter(q=>{const s=state.qs[q.id];return s&&s.w>0&&s.box===0;})
    .sort((a,b)=>(st(b.id).w/(st(b.id).r+st(b.id).w))-(st(a.id).w/(st(a.id).r+st(a.id).w)));
  return shuffle(w.slice(0,8));
}
function startLesson(k){
  L=k; const qs=k==="weak"?pickWeak():k==="today"?pickToday():k==="exam"?pickExam():pickFor(k);
  if(!qs.length) return;

  if(k==="exam"){EX={start:Date.now(),got:0,max:qs.reduce((a,q)=>a+qPts(q),0),log:[]};
    exTimer=setInterval(()=>{const e=document.getElementById("exT");if(e&&EX)e.textContent=mmss(Date.now()-EX.start);},1000);}
  queue=qs.map(q=>({q,retry:false})); pos=0; total=qs.length; correct=0; results=[];

}
const optBtn=(i,k,txt,grp)=>`<button class="opt" data-g="${grp||"a"}" data-i="${i}" aria-pressed="false"><span class="k">${k}</span><span>${esc(txt)}</span></button>`;

       <div class="chips">${q.cats.map((c,ci)=>`<button class="chip" data-row="${ii}" data-c="${ci}" aria-pressed="false">${esc(c)}</button>`).join("")}</div></div>`;}).join("")}</div>`;

   <div class="tags"><span class="tag" style="--c:${t.c}">${esc(q.f?"F"+q.f:t.short)} · ${esc(q.t)}</span><span class="tag" style="--c:var(--blue)">${LVL[q.l]}</span>${EX?`<span class="tag" style="--c:var(--red)">${qPts(q)} p</span>`:""}${cur.retry?`<span class="tag" style="--c:var(--red)">Ny chans</span>`:""}${q._review?`<span class="tag" style="--c:var(--purple)">Repetition</span>`:""}${q.chk===false?`<span class="tag muted">Ej kontrollerad mot föreläsning</span>`:""}</div>

  $("#quit").onclick=()=>{clearInterval(exTimer);EX=null;screen="home";persist();render();};
  bindOpts("a");

function bindOpts(grp){
  const q=cur.q;
  document.querySelectorAll(`.opt[data-g="${grp}"]`).forEach(b=>b.onclick=()=>{if(answered)return;

function bindCloze(){
  const paint=()=>{document.querySelectorAll(".blank").forEach(b=>{const i=+b.dataset.b,w=cur.fill[i];
      b.innerHTML=w===null?"&nbsp;":esc(cur.bank[w]);b.classList.toggle("fill",w!==null);b.classList.toggle("act",i===cur.act&&!answered);});
    document.querySelectorAll("#bank .chip").forEach(c=>{const u=cur.fill.includes(+c.dataset.w);c.classList.toggle("used",u);c.disabled=u||answered;});
    showCheck(cur.fill.every(v=>v!==null));};
  document.querySelectorAll(".blank").forEach(b=>b.onclick=()=>{if(answered)return;const i=+b.dataset.b;cur.fill[i]=null;cur.act=i;paint();});

function check(){
  const q=cur.q; let ok,given;
  if(q.type==="text") return showPoints();
  if(q.type==="tfw"&&cur.phase===1){
    const tfOk=(sel===1)===q.a; cur.tfOk=tfOk;
    if(EX){document.querySelectorAll('.opt[data-g="a"]').forEach(b=>b.disabled=true);}
    else{ markOpts("a",i=>(i===1)===q.a);
      if(!tfOk){answered=true;record(false,sel===1?"Sant":"Falskt");return feedback(false);} }
    cur.phase=2; sel=null; const t=q.then; cur.order2=shuffle(t.o.map((_,i)=>i));
    const tq=EX?t.q.replace(/är påståendet (sant|falskt)\?/,"är påståendet sant eller falskt?"):t.q;
    $("#step2").innerHTML=`<div class="step2 slide"><span class="tag" style="--c:${EX?"var(--blue)":"var(--good)"}">${EX?"Motivera (ger bara poäng om sant/falskt var rätt)":`Rätt, ${q.a?"sant":"falskt"}. Nu motiveringen`}</span><h2 class="q" style="margin-top:10px">${esc(tq)}</h2>
      <div class="opts" role="group">${cur.order2.map((oi,k)=>optBtn(oi,k+1,t.o[oi],"b")).join("")}</div></div>`;
    bindOpts("b"); showCheck(false); $("#step2").scrollIntoView({behavior:"smooth",block:"start"}); return;
  }
  answered=true;

  else if(q.type==="multi"){const A=new Set(q.a);ok=cur.multi.size===A.size&&[...cur.multi].every(i=>A.has(i));given=[...cur.multi].map(i=>q.o[i]).join(" | ");markOpts("a",i=>A.has(i));}
  else if(q.type==="tf"){ok=(sel===1)===q.a;given=sel===1?"Sant":"Falskt";markOpts("a",i=>(i===1)===q.a);}
  else if(q.type==="tfw"){ok=sel===q.then.a&&cur.tfOk!==false;given="Motivering: "+q.then.o[sel];markOpts("b",i=>i===q.then.a);}
  else if(q.type==="match"){ok=q.items.every((it,i)=>cur.m[i]===it.a);given=q.items.map((it,i)=>it.t+"→"+q.cats[cur.m[i]]).join(", ");
    document.querySelectorAll(".chip[data-row]").forEach(b=>{b.disabled=true;const r=+b.dataset.row,c=+b.dataset.c;

  else if(q.type==="cloze"){const ans=clozeAns(q);ok=ans.every((a,i)=>cur.bank[cur.fill[i]]===a);given=cur.fill.map(w=>cur.bank[w]).join(", ");
    cur.repaint(); document.querySelectorAll(".blank").forEach(b=>{const i=+b.dataset.b;b.disabled=true;b.classList.remove("act","fill");b.classList.add(cur.bank[cur.fill[i]]===ans[i]?"is-right":"is-wrong");});}
  record(ok,given);
  if(EX){let p=ok?qPts(q):0;
    if(q.type==="tfw") p=cur.tfOk?1+(ok?2:0):0;
    if(q.type==="match") p=q.items.filter((it,i)=>cur.m[i]===it.a).length;
    if(q.type==="cloze"){const ans=clozeAns(q);p=ans.filter((a,i)=>cur.bank[cur.fill[i]]===a).length;}

}

  const s=$("#sheet"); s.className="sheet";
  $("#sheetIn").innerHTML=`<button class="btn wide" id="grade">Klar med rättningen</button>`;
  $("#grade").onclick=()=>{
    const n=cur.q.pts.length,got=cur.q.pts.filter((_,i)=>$("#pt"+i).checked).length;
    const missing=cur.q.pts.filter((_,i)=>!$("#pt"+i).checked);
    document.querySelectorAll(".pts input").forEach(i=>i.disabled=true);
    const ok=got===n; record(ok,`${got}/${n} punkter`,true);
    if(EX) return examPoint(Math.round(3*got/n));
    feedback(ok,{got,n,missing});
  };
  $("#ptsBox").scrollIntoView({behavior:"smooth",block:"start"});
}
function record(ok,given,isText){
  const q=cur.q,s=st(q.id); s.seen++; s.last=Date.now(); markDay();
  if(!cur.retry){if(!state.dn||state.dn.d!==today())state.dn={d:today(),n:0};state.dn.n++;}
  if(ok){s.r++; if(!cur.retry) s.box=Math.min(s.box+1,5); state.xp+=cur.retry?5:10; correct++;}
  else {s.w++; s.box=0; s.lw=String(given).slice(0,200);
    if(!isText && !EX && queue.filter(x=>x.q.id===q.id).length<3) queue.push({q,retry:true});
    if(isText) correct++; }
  results.push({q,ok,retry:cur.retry});
  persist();
}
function feedback(ok,txt){
  const q=cur.q,s=$("#sheet"); s.hidden=false; s.className="sheet "+(ok?"good":"bad")+" slide";
  let right="";
  if(!ok){
    if(q.type==="mc") right=q.o[q.a];
    if(q.type==="multi") right=q.a.map(i=>q.o[i]).join(" · ");
    if(q.type==="tf") right=q.a?"Sant":"Falskt";
    if(q.type==="tfw") right=(q.a?"Sant":"Falskt")+". "+q.then.o[q.then.a];
    if(q.type==="match") right=q.items.filter((it,i)=>cur.m[i]!==it.a).map(it=>it.t+" → "+q.cats[it.a]).join("<br>");
    if(q.type==="cloze") right=clozeAns(q).join(" · ");
  }
  const rightHtml=right?`<div class="fb"><span class="lbl">Rätt svar</span>${q.type==="match"?right.split("<br>").map(esc).join("<br>"):esc(right)}</div>`:"";
  const why=q.type==="tfw"?q.then.why:q.why;
  let verdict=ok?pickOne(["Rätt!","Snyggt!","Precis.","Helt rätt."]):"Inte riktigt", main;
  if(q.type==="text"){
    verdict=ok?"Fullpoängssvar":txt.got?`Delvis rätt, ${txt.got} av ${txt.n}`:"Facitpunkterna saknas";
    main=ok?`<div class="fb">Alla facitpunkter finns med.</div>`:`<div class="fb"><span class="lbl">Saknas för full poäng</span>${txt.missing.map(m=>"• "+esc(m)).join("<br>")}</div><div class="fb"><span class="lbl">Tips</span>${esc(q.alt)}</div>`;
  } else main=ok?`<div class="fb">${esc(why)}</div>`:`${rightHtml}<div class="fb"><span class="lbl">Varför</span>${esc(why)}</div><div class="fb"><span class="lbl">Ny vinkel</span>${esc(q.alt)}</div>`;
  $("#sheetIn").innerHTML=`<div class="verdict pop"><span class="badge">${ok?I.check:I.cross}</span>${verdict}</div>${main}
    <div class="fb small">${esc(q.r)}${q.chk===false?" · facit ej kontrollerat mot föreläsning":""}${!ok&&q.type!=="text"?" · frågan kommer tillbaka":""}</div>
    <button class="btn wide ${ok?"good":"bad"}" id="next">Fortsätt</button>`;
  $("#next").onclick=next; $("#next").focus();
  const bar=document.querySelector(".bar i"); if(bar) bar.style.width=Math.round(100*correct/total)+"%";
}
function next(){ pos++; if(pos>=queue.length){screen="sum";render();} else {window.scrollTo(0,0);renderQ();} }
function renderExamSum(){
  clearInterval(exTimer);
  const sec=Math.round((Date.now()-EX.start)/1000), pct=EX.max?Math.round(100*EX.got/EX.max):0;
  state.exams=(state.exams||[]).concat([{d:today(),got:EX.got,max:EX.max,sec}]).slice(-10); persist();
  const lost=EX.log.filter(x=>x.p<x.max);
  $("#app").innerHTML=`<section class="sum">
    <div class="trophy pop">${I.trophy}</div>
    <h2>Tentasimulering klar</h2>
    <div class="score">${EX.got}<small> / ${EX.max} p</small></div>
    <div class="tiles">
      <div class="tile" style="--c:var(--teal)"><div class="h">Andel</div><b>${pct}%</b></div>
      <div class="tile" style="--c:var(--blue)"><div class="h">Tid</div><b>${mmss(sec*1000)}</b></div>
      <div class="tile" style="--c:var(--orange)"><div class="h">Frågor</div><b>${EX.log.length}</b></div>
    </div>
    ${lost.length?`<div style="width:100%;text-align:left"><h3 class="section-h">Tappade poäng</h3><div class="group">${lost.map(x=>`<div class="row exrow"><span class="dot"></span><span class="t">${esc(x.q.q)}<span class="r"><b>Rätt:</b> ${esc(rightText(x.q))}<br>${esc(x.q.r)}</span></span><span class="pct">${x.p}/${x.max}</span></div>`).join("")}</div>
      <p class="foot">Frågorna med fel hamnar under svaga punkter.</p></div>`:""}
    <button class="btn wide good" id="home">Fortsätt</button>
    <button class="btn wide plain" id="again">Ny tentasimulering</button>
  </section>`;
  EX=null;
  $("#home").onclick=()=>{screen="home";render();};
  $("#again").onclick=()=>startLesson("exam");
}
function renderSum(){
  hideSheet(); window.scrollTo(0,0);
  if(EX) return renderExamSum();
  const first=results.filter(r=>!r.retry), firstOk=first.filter(r=>r.ok).length;
  const missed=[...new Map(results.filter(r=>!r.ok).map(r=>[r.q.id,r.q])).values()];
  const pct=first.length?Math.round(100*firstOk/first.length):0;
  const xp=results.reduce((s,r)=>s+(r.ok?(r.retry?5:10):0),0);
  $("#app").innerHTML=`<section class="sum">
    <div class="trophy pop">${I.trophy}</div>
    <h2>${pct>=80?"Starkt pass!":pct>=50?"Omgången klar!":"Bra att du såg det nu"}</h2>
    <div class="tiles">
      <div class="tile" style="--c:var(--yellow)"><div class="h">XP</div><b>+${xp}</b></div>
      <div class="tile" style="--c:var(--teal)"><div class="h">Rätt direkt</div><b>${pct}%</b></div>
      <div class="tile" style="--c:var(--orange)"><div class="h">Dagar</div><b>${streak()}</b></div>
    </div>
    ${missed.length?`<div style="width:100%;text-align:left"><h3 class="section-h">Repetera</h3><div class="group">${missed.map(q=>`<div class="row"><span class="dot"></span><span class="t">${esc(q.t)}<span class="r">${esc(q.r)}</span></span><span></span></div>`).join("")}</div><p class="foot">Står kvar som svaga tills du svarar rätt direkt i en senare omgång.</p></div>`:""}
    <button class="btn wide good" id="home">Fortsätt</button>
    ${L!=="weak"?`<button class="btn wide plain" id="again">Kör en omgång till</button>`:""}
  </section>`;
  $("#home").onclick=()=>{screen="home";render();};
  const a=$("#again"); if(a) a.onclick=()=>startLesson(L);
}
document.addEventListener("keydown",e=>{
  if(screen!=="lesson")return;
  if(e.target.tagName==="TEXTAREA")return;
  if(/^[1-4]$/.test(e.key)&&!answered){const g=cur&&cur.phase===2?"b":"a";const b=document.querySelectorAll(`.opt[data-g="${g}"]`)[+e.key-1];if(b)b.click();}
  if(e.key==="Enter"){const n=$("#next")||$("#check");if(n&&!n.disabled){e.preventDefault();n.click();}}
});
let rzW=innerWidth; addEventListener("resize",()=>{if(innerWidth!==rzW){rzW=innerWidth;if(screen==="home")render();}});
loadLocal(); render(); initDb();
</script>

</body>
